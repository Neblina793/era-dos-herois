<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151b">
  <title>Era dos Heróis — Portal Mitológico</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #10151b; }
    body { overflow: hidden; }
    #portal {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      background: #10151b;
    }
    #aviso {
      position: fixed;
      z-index: 5;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 12px;
      padding: 24px;
      color: #eee5d2;
      background: #10151b;
      text-align: center;
      font: 16px/1.5 Georgia, serif;
    }
    #aviso strong {
      color: #d8b56a;
      font: 700 22px Georgia, serif;
    }
    #aviso small { color: #b8ad98; }
    .oculto { display: none !important; }
  </style>
</head>
<body>
  <div id="aviso">
    <strong>ERA DOS HERÓIS</strong>
    <span>Invocando o mundo mitológico…</span>
    <small>Se esta mensagem permanecer, confira se o arquivo <b>index-original.html</b> está na raiz do repositório.</small>
  </div>

  <iframe
    id="portal"
    title="Portal de Era dos Heróis"
    src="index-original.html"
    loading="eager"
    allow="fullscreen"
  ></iframe>

  <script>
    (function () {
      const frame = document.getElementById('portal');
      const aviso = document.getElementById('aviso');

      frame.addEventListener('load', function () {
        try {
          const doc = frame.contentDocument;
          if (!doc || !doc.head) throw new Error('Página original indisponível');

          // Carrega a camada mitológica depois dos estilos originais,
          // sem apagar os estilos, textos ou scripts já existentes.
          if (!doc.querySelector('link[data-camada-mitologica]')) {
            const camada = doc.createElement('link');
            camada.rel = 'stylesheet';
            camada.href = 'styles-mitologico.css';
            camada.dataset.camadaMitologica = 'true';
            doc.head.appendChild(camada);
          }

          doc.documentElement.style.scrollBehavior = 'smooth';
          aviso.classList.add('oculto');
        } catch (erro) {
          aviso.innerHTML =
            '<strong>Não foi possível carregar o portal</strong>' +
            '<span>Confira se <b>index-original.html</b> e <b>styles-mitologico.css</b> estão na raiz do repositório.</span>';
        }
      });
    })();
  </script>
</body>
</html>
