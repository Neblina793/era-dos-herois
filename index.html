<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicativo Desativado</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', Courier, monospace;
        }

        /* O ruído de fundo */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.15;
        }

        /* Overlay de linhas de TV antiga */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg, 
                rgba(255, 0, 0, 0.06), 
                rgba(0, 255, 0, 0.02), 
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 3px 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Container da mensagem */
        .container {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #fff;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px #ff0000, -2px -2px #0000ff;
            animation: glitch 0.3s infinite;
        }

        p {
            color: #aaa;
            font-size: 1rem;
            margin-top: 10px;
        }

        /* Efeito de glitch no texto */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        /* Vinheta (bordas escuras) */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            z-index: 4;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="noise"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="container">
        <h1>SINAL INTERROMPIDO</h1>
        <p>Este aplicativo foi desativado pelo administrador.</p>
    </div>

    <script>
        const canvas = document.getElementById('noise');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth / 2; // Resolução menor para parecer lo-fi
            canvas.height = window.innerHeight / 2;
        }

        function noise(ctx) {
            const w = ctx.canvas.width;
            const h = ctx.canvas.height;
            const idata = ctx.createImageData(w, h);
            const buffer32 = new Uint32Array(idata.data.buffer);
            const len = buffer32.length;
            
            for (let i = 0; i < len; i++) {
                if (Math.random() < 0.5) buffer32[i] = 0xff000000; // Pixel preto
                else buffer32[i] = 0xffffffff; // Pixel branco
            }
            
            ctx.putImageData(idata, 0, 0);
        }

        let frame = 0;
        function loop() {
            frame++;
            if (frame % 2 === 0) { // Gera ruído a cada 2 frames para não sobrecarregar
                noise(ctx);
            }
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resize);
        resize();
        loop();
    </script>
</body>
</html>
