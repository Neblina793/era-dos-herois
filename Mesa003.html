<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabuleiro RPG — Ultimate Pro</title>
  <style>
    :root {
      --bg: #05070a; --panel: #101425; --accent: #6ea8fe;
      --bad: linear-gradient(180deg, #ff4d4d 0%, #b30000 100%); 
      --good: linear-gradient(180deg, #2ecc71 0%, #27ae60 100%); 
      --temp: linear-gradient(180deg, #f1c40f 0%, #f39c12 100%);
      --cell: 48;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: #e8edff; font-family: sans-serif; overflow: hidden; }
    .app { display: flex; height: 100%; }
    
    /* Sidebar */
    .sidebar { width: 300px; background: var(--panel); padding: 15px; border-right: 1px solid #1b2550; overflow-y: auto; z-index: 500; }
    .layer-group { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #1b2550; }
    input, button, select { background: #0a0e1a; color: white; border: 1px solid #1b2550; padding: 7px; border-radius: 4px; font-size: 12px; width: 100%; margin-bottom: 5px; }
    button { cursor: pointer; font-weight: bold; }
    button:hover { background: var(--accent); color: #000; }
    .btn-active { background: var(--accent) !important; color: #000 !important; }

    /* Board */
    .board-wrap { flex: 1; position: relative; overflow: hidden; background: #000; }
    .world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
    
    /* Camadas */
    .map-layer { position: absolute; z-index: 1; pointer-events: none; }
    .map-layer img { display: block; }
    .resizable { border: 2px dashed var(--accent); pointer-events: all !important; }
    
    /* Selection Box */
    #selection-box { position: absolute; border: 1px solid var(--accent); background: rgba(110,168,254,0.2); pointer-events: none; display: none; z-index: 1000; }

    /* Ruler */
    #ruler-line { position: absolute; height: 2px; background: var(--accent); transform-origin: 0 50%; pointer-events: none; z-index: 900; display: none; }
    #ruler-text { position: absolute; background: #000; padding: 2px 5px; border-radius: 4px; font-size: 12px; color: var(--accent); pointer-events: none; z-index: 901; display: none; border: 1px solid var(--accent); }

    /* Tokens */
    .token { position: absolute; cursor: move; display: flex; flex-direction: column; align-items: center; transition: transform 0.2s; z-index: 100; }
    .token-selected { filter: drop-shadow(0 0 5px var(--accent)); }
    .token-img-wrap { position: relative; width: 100%; height: 100%; }
    .token-img { width: 100%; height: 100%; object-fit: contain; }
    
    /* Status Icons */
    .status-container { position: absolute; top: 0; right: 0; display: flex; flex-wrap: wrap; gap: 2px; width: 40%; pointer-events: none; }
    .status-icon { background: rgba(0,0,0,0.7); border-radius: 50%; padding: 2px; font-size: 10px; }

    /* Context Menu */
    #ctx-menu { position: fixed; display: none; background: #0a0e1a; border: 1px solid var(--accent); border-radius: 8px; padding: 5px; z-index: 2000; min-width: 170px; }
    #ctx-menu button { text-align: left; background: transparent; border: none; padding: 8px; width: 100%; }
    #ctx-menu button:hover { background: #1b2550; }

    #grid-svg { position: absolute; top: -5000px; left: -5000px; width: 10000px; height: 10000px; pointer-events: none; z-index: 20; }
    #fogCanvas { position: absolute; top: -5000px; left: -5000px; z-index: 40; pointer-events: none; }
  </style>
</head>
<body>

<div id="ctx-menu">
  <div id="ctx-name" style="text-align:center; padding: 5px; color: var(--accent); border-bottom: 1px solid #333">Nome</div>
  <button onclick="changeHP(true)">➕ Curar</button>
  <button onclick="changeHP(false)">➖ Dano</button>
  <button onclick="toggleStatusPrompt()">🎭 Adicionar Status</button>
  <button onclick="toggleAura()">✨ Alternar Aura</button>
  <button onclick="toggleFlip()">↔️ Inverter</button>
  <button onclick="deleteSelected()" style="color: #ff4d4d">❌ Remover (Del)</button>
</div>

<div class="app">
  <aside class="sidebar">
    <h2>Mesa</h2>
    <div class="layer-group">
      <button onclick="saveGame()">💾 Salvar Local</button>
      <button onclick="exportJSON()">📤 Exportar Mesa</button>
      <button onclick="document.getElementById('importInput').click()">📥 Importar</button>
      <input type="file" id="importInput" style="display:none" onchange="importJSON(event)">
    </div>

    <h2>Mapas</h2>
    <div class="layer-group">
      <input type="file" onchange="handleMap(event, 0)">
      <button onclick="toggleMapResize(0)">📏 Ajustar Mapa 1</button>
      <input type="file" onchange="handleMap(event, 1)">
      <button onclick="toggleMapResize(1)">📏 Ajustar Mapa 2</button>
    </div>

    <h2>Herói / NPC</h2>
    <div class="layer-group">
      <input type="text" id="tName" placeholder="Nome">
      <input type="number" id="tHP" value="20" placeholder="HP">
      <input type="file" id="tImg">
      <button onclick="addNewToken()" style="background: var(--good)">Criar Token</button>
    </div>

    <h2>Névoa</h2>
    <div class="layer-group">
      <button onclick="toggleFog()">Ativar/Desativar</button>
      <button id="brushBtn" onclick="toggleBrush()">🖌️ Pincel</button>
      <button onclick="state.fogDynamic = !state.fogDynamic" id="dynFogBtn">Auto-Revelar: OFF</button>
    </div>

    <h2>Config</h2>
    <div class="layer-group">
      <input type="number" id="gridSize" value="48" onchange="updateGrid()">
      <button onclick="toggleGrid()">Grade ON/OFF</button>
    </div>
  </aside>

  <main class="board-wrap" id="boardWrap">
    <div id="selection-box"></div>
    <div id="ruler-line"></div>
    <div id="ruler-text">0m</div>
    <div id="board" class="world">
      <div id="layer0" class="map-layer"></div>
      <div id="layer1" class="map-layer"></div>
      <canvas id="fogCanvas" width="10000" height="10000"></canvas>
      <svg id="grid-svg"></svg>
      <div id="tokensContainer"></div>
    </div>
  </main>
</div>

<script>
  const state = {
    zoom: 1, pan: {x:0, y:0}, cell: 48,
    tokens: {}, selectedIds: [], 
    fogActive: false, brushMode: false, fogDynamic: false,
    history: []
  };

  const board = document.getElementById('board');
  const boardWrap = document.getElementById('boardWrap');
  const fogCanvas = document.getElementById('fogCanvas');
  const fogCtx = fogCanvas.getContext('2d');
  const rulerLine = document.getElementById('ruler-line');
  const rulerText = document.getElementById('ruler-text');

  // --- Inicialização ---
  function init() {
    fogCtx.fillStyle = 'black';
    fogCtx.fillRect(0, 0, 10000, 10000);
    updateGrid();
    loadLocal();
  }

  // --- Câmera e Mouse ---
  let isPanning = false, isSelecting = false, startPos = {x:0, y:0};
  
  boardWrap.onmousedown = (e) => {
    if (e.button === 2 || e.button === 1) {
      isPanning = true;
      startPos = {x: e.clientX - state.pan.x, y: e.clientY - state.pan.y};
    } else if (e.button === 0 && !e.target.closest('.token')) {
      isSelecting = true;
      startPos = {x: e.clientX, y: e.clientY};
      clearSelection();
    }
  };

  window.onmousemove = (e) => {
    if (isPanning) {
      state.pan.x = e.clientX - startPos.x;
      state.pan.y = e.clientY - startPos.y;
      applyTransform();
    } else if (isSelecting) {
      drawSelectionBox(e);
    }
  };

  window.onmouseup = () => {
    isPanning = false;
    if (isSelecting) finishSelection();
    isSelecting = false;
    document.getElementById('selection-box').style.display = 'none';
  };

  function applyTransform() {
    board.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.zoom})`;
  }

  boardWrap.onwheel = (e) => {
    e.preventDefault();
    const oldZoom = state.zoom;
    state.zoom *= e.deltaY > 0 ? 0.9 : 1.1;
    const rect = boardWrap.getBoundingClientRect();
    const mX = e.clientX - rect.left, mY = e.clientY - rect.top;
    state.pan.x = mX - (mX - state.pan.x) * (state.zoom / oldZoom);
    state.pan.y = mY - (mY - state.pan.y) * (state.zoom / oldZoom);
    applyTransform();
  };

  // --- Tokens e Movimentação ---
  function addNewToken(data = null) {
    const id = data?.id || "t-" + Date.now();
    if (data) {
      state.tokens[id] = data;
    } else {
      const img = document.getElementById('tImg').files[0];
      if (!img) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        state.tokens[id] = {
          id, name: document.getElementById('tName').value || "NPC",
          hp: parseInt(document.getElementById('tHP').value), maxHP: parseInt(document.getElementById('tHP').value),
          x: 100, y: 100, size: 1, img: e.target.result, status: [], flipped: false, aura: false
        };
        renderTokens();
      };
      reader.readAsDataURL(img);
      return;
    }
    renderTokens();
  }

  function renderTokens() {
    const container = document.getElementById('tokensContainer');
    container.innerHTML = '';
    Object.values(state.tokens).forEach(t => {
      const div = document.createElement('div');
      div.className = `token ${state.selectedIds.includes(t.id) ? 'token-selected' : ''}`;
      div.id = t.id;
      const dim = t.size * state.cell;
      div.style.cssText = `width:${dim}px; height:${dim}px; left:${t.x}px; top:${t.y}px;`;
      
      div.innerHTML = `
        <div class="status-container">${t.status.map(s => `<span class="status-icon">${s}</span>`).join('')}</div>
        <div class="token-img-wrap" style="transform: ${t.flipped ? 'scaleX(-1)' : 'scaleX(1)'}">
            ${t.aura ? `<div style="position:absolute; inset:-10px; border-radius:50%; background:rgba(110,168,254,0.3); z-index:-1; filter:blur(5px)"></div>` : ''}
            <img src="${t.img}" class="token-img" draggable="false">
        </div>
        <div style="background:rgba(0,0,0,0.8); width:100%; height:4px; margin-top:2px; border-radius:2px">
            <div style="background:#2ecc71; height:100%; width:${(t.hp/t.maxHP)*100}%"></div>
        </div>
        <div style="font-size:10px; white-space:nowrap">${t.name}</div>
      `;

      div.onmousedown = (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        if (!e.ctrlKey && !state.selectedIds.includes(t.id)) clearSelection();
        if (!state.selectedIds.includes(t.id)) state.selectedIds.push(t.id);
        
        let startX = e.clientX, startY = e.clientY;
        const initialX = t.x, initialY = t.y;

        showRuler(true);

        const onMove = (m) => {
          const dx = (m.clientX - startX) / state.zoom;
          const dy = (m.clientY - startY) / state.zoom;
          
          state.selectedIds.forEach(sid => {
            const tok = state.tokens[sid];
            const el = document.getElementById(sid);
            el.style.left = (tok.x + dx) + 'px';
            el.style.top = (tok.y + dy) + 'px';
          });

          updateRuler(initialX + (dim/2), initialY + (dim/2), (t.x + dx) + (dim/2), (t.y + dy) + (dim/2));
        };

        const onUp = (m) => {
          const dx = (m.clientX - startX) / state.zoom;
          const dy = (m.clientY - startY) / state.zoom;
          
          state.selectedIds.forEach(sid => {
            state.tokens[sid].x = Math.round((state.tokens[sid].x + dx) / state.cell) * state.cell;
            state.tokens[sid].y = Math.round((state.tokens[sid].y + dy) / state.cell) * state.cell;
          });
          
          if(state.fogDynamic) revealFog(t.x, t.y);
          showRuler(false);
          renderTokens();
          window.removeEventListener('mousemove', onMove);
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp, {once:true});
      };

      div.oncontextmenu = (e) => {
        e.preventDefault(); e.stopPropagation();
        showContextMenu(e, t);
      };

      container.appendChild(div);
    });
  }

  // --- Régua ---
  function showRuler(show) {
    rulerLine.style.display = show ? 'block' : 'none';
    rulerText.style.display = show ? 'block' : 'none';
  }

  function updateRuler(x1, y1, x2, y2) {
    const worldX1 = x1 * state.zoom + state.pan.x;
    const worldY1 = y1 * state.zoom + state.pan.y;
    const worldX2 = x2 * state.zoom + state.pan.x;
    const worldY2 = y2 * state.zoom + state.pan.y;

    const distPx = Math.sqrt(Math.pow(x2-x1, 2) + Math.pow(y2-y1, 2));
    const distMeters = ((distPx / state.cell) * 1.5).toFixed(1);

    rulerLine.style.width = Math.sqrt(Math.pow(worldX2-worldX1, 2) + Math.pow(worldY2-worldY1, 2)) + 'px';
    rulerLine.style.left = worldX1 + 'px';
    rulerLine.style.top = worldY1 + 'px';
    rulerLine.style.transform = `rotate(${Math.atan2(worldY2-worldY1, worldX2-worldX1)}rad)`;
    
    rulerText.style.left = worldX2 + 'px';
    rulerText.style.top = (worldY2 - 20) + 'px';
    rulerText.innerText = distMeters + "m";
  }

  // --- Seleção ---
  function drawSelectionBox(e) {
    const box = document.getElementById('selection-box');
    box.style.display = 'block';
    const left = Math.min(startPos.x, e.clientX);
    const top = Math.min(startPos.y, e.clientY);
    const width = Math.abs(startPos.x - e.clientX);
    const height = Math.abs(startPos.y - e.clientY);
    box.style.left = left + 'px';
    box.style.top = top + 'px';
    box.style.width = width + 'px';
    box.style.height = height + 'px';
  }

  function finishSelection() {
    const box = document.getElementById('selection-box').getBoundingClientRect();
    Object.values(state.tokens).forEach(t => {
      const el = document.getElementById(t.id).getBoundingClientRect();
      if (el.left >= box.left && el.right <= box.right && el.top >= box.top && el.bottom <= box.bottom) {
        if (!state.selectedIds.includes(t.id)) state.selectedIds.push(t.id);
      }
    });
    renderTokens();
  }

  function clearSelection() { state.selectedIds = []; renderTokens(); }

  // --- Névoa ---
  function toggleFog() { 
    state.fogActive = !state.fogActive; 
    fogCanvas.style.display = state.fogActive ? 'block' : 'none'; 
  }

  function revealFog(x, y) {
    fogCtx.globalCompositeOperation = 'destination-out';
    fogCtx.beginPath();
    fogCtx.arc(x + 5000 + (state.cell/2), y + 5000 + (state.cell/2), state.cell * 2.5, 0, Math.PI*2);
    fogCtx.fill();
  }

  // --- Sistema de Arquivos ---
  function saveGame() {
    localStorage.setItem('rpg_save', JSON.stringify(state));
    alert("Salvo!");
  }

  function loadLocal() {
    const saved = localStorage.getItem('rpg_save');
    if (saved) {
      const data = JSON.parse(saved);
      Object.assign(state, data);
      renderTokens();
      applyTransform();
    }
  }

  function exportJSON() {
    const blob = new Blob([JSON.stringify(state)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'mesa_rpg.json'; a.click();
  }

  // --- Funções Auxiliares ---
  function updateGrid() {
    state.cell = parseInt(document.getElementById('gridSize').value);
    document.getElementById('grid-svg').innerHTML = `<defs><pattern id="grid" width="${state.cell}" height="${state.cell}" patternUnits="userSpaceOnUse"><path d="M ${state.cell} 0 L 0 0 0 ${state.cell}" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(#grid)" />`;
  }

  function showContextMenu(e, t) {
    const menu = document.getElementById('ctx-menu');
    menu.style.display = 'block';
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
    document.getElementById('ctx-name').innerText = t.name;
    state.lastRightClickId = t.id;
  }

  window.onkeydown = (e) => {
    if (e.key === "Delete") {
      state.selectedIds.forEach(id => delete state.tokens[id]);
      clearSelection();
    }
    if (e.ctrlKey && e.key === "z") {
       // Lógica simples de desfazer pode ser expandida aqui
    }
  };

  window.onclick = () => document.getElementById('ctx-menu').style.display = 'none';
  window.oncontextmenu = (e) => e.preventDefault();

  init();
</script>
</body>
</html>
