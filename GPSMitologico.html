<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Mitológico - Era dos Heróis</title>
    <style>
        :root {
            --bg-principal: #0a0a0a;
            --bg-card: #121212;
            --bg-input: #1a1a1a;
            --dourado: #d4af37;
            --dourado-brilho: #f3e5ab;
            --dourado-escuro: #aa841c;
            --texto-claro: #f0ede5;
            --texto-escuro: #8c887d;
            --borda: #2a2415;
            --perigo: #e74c3c;
            --seguro: #2ecc71;
            --font-fantasy: 'Georgia', serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-claro);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #151208 0%, #050505 100%);
        }

        .gps-box {
            background-color: var(--bg-card);
            border: 2px solid var(--dourado);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
            width: 100%;
            max-width: 850px;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--borda);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        header h1 {
            font-family: var(--font-fantasy);
            color: var(--dourado);
            font-size: 1.8rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Grid de Configuração - Responsivo */
        .config-grid {
            display: grid;
            grid-template-columns: 1fr; /* Padrão celular */
            gap: 20px;
        }

        @media (min-width: 600px) {
            .config-grid {
                grid-template-columns: 1fr 1fr; /* Lado a lado no PC/Tablet */
            }
            header h1 { font-size: 2.2rem; }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: var(--dourado);
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        select {
            background-color: var(--bg-input);
            border: 1px solid var(--borda);
            color: var(--texto-claro);
            padding: 12px;
            font-size: 1rem;
            border-radius: 6px;
            width: 100%;
        }

        /* Container de Transporte */
        .transporte-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            grid-column: 1 / -1; /* Ocupa a linha toda */
        }

        .transporte-option input[type="radio"] { display: none; }

        .transporte-label {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-input);
            border: 1px solid var(--borda);
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.3s;
            text-align: center;
        }

        .transporte-option input[type="radio"]:checked + .transporte-label {
            border-color: var(--dourado);
            background-color: rgba(212, 175, 55, 0.1);
            color: var(--dourado-brilho);
        }

        .btn-calcular {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, var(--dourado-escuro), var(--dourado));
            color: #000;
            font-weight: bold;
            padding: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-fantasy);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        /* Resultados - Responsivo */
        .resultado-container {
            display: none;
            flex-direction: column;
            gap: 20px;
            margin-top: 25px;
            border-top: 1px solid var(--borda);
            padding-top: 25px;
        }

        .resumo-viagem {
            text-align: center;
            font-size: 1rem;
            color: var(--texto-escuro);
        }

        .resumo-viagem span { color: var(--dourado); font-weight: bold; }

        .rotas-grid {
            display: grid;
            grid-template-columns: 1fr; /* Empilha no celular */
            gap: 15px;
        }

        @media (min-width: 700px) {
            .rotas-grid {
                grid-template-columns: 1fr 1fr; /* Lado a lado no PC */
            }
        }

        .rota-card {
            background-color: #0d0d0d;
            border: 1px solid var(--borda);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .rota-card.rapida { border-left: 4px solid var(--perigo); }
        .rota-card.segura { border-left: 4px solid var(--seguro); }

        .rota-titulo { font-family: var(--font-fantasy); margin: 0; font-size: 1.2rem; }
        
        .tempo-viagem {
            font-size: 1.6rem;
            color: var(--dourado);
            font-weight: bold;
            margin: 10px 0;
        }

        .detalhes-texto {
            font-size: 0.85rem;
            color: var(--texto-escuro);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .info-box {
            background-color: rgba(255,255,255,0.03);
            border-radius: 4px;
            padding: 10px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="gps-box">
        <header>
            <h1>GPS Mitológico</h1>
            <p>Era dos Heróis (1ª Temporada)</p>
        </header>

        <div class="config-grid">
            <div class="control-group">
                <label>Partida</label>
                <select id="partida"></select>
            </div>

            <div class="control-group">
                <label>Chegada</label>
                <select id="chegada"></select>
            </div>

            <div class="transporte-container">
                <div class="transporte-option">
                    <input type="radio" name="transporte" id="pe" value="pe" checked>
                    <label for="pe" class="transporte-label">🚶 A Pé</label>
                </div>
                <div class="transporte-option">
                    <input type="radio" name="transporte" id="cavalo" value="cavalo">
                    <label for="cavalo" class="transporte-label">🐎 A Cavalo</label>
                </div>
            </div>

            <button class="btn-calcular" onclick="calcularViagem()">Calcular Rota</button>
        </div>

        <div id="resultado" class="resultado-container">
            <div class="resumo-viagem">
                De <span id="resumo-origem"></span> até <span id="resumo-destino"></span>
            </div>

            <div class="rotas-grid">
                <div class="rota-card rapida">
                    <h3 class="rota-titulo">Rota Rápida</h3>
                    <div class="tempo-viagem" id="tempo-rapida"></div>
                    <div class="detalhes-texto">Atravessa terrenos selvagens e áreas não patrulhadas.</div>
                    <div class="info-box">
                        <strong style="color:var(--perigo)">⚠️ RISCO:</strong>
                        <p id="perigos-texto" style="margin:5px 0 0 0"></p>
                    </div>
                </div>

                <div class="rota-card segura">
                    <h3 class="rota-titulo">Rota Segura</h3>
                    <div class="tempo-viagem" id="tempo-segura"></div>
                    <div class="detalhes-texto">Utiliza estradas imperiais e rotas comerciais vigiadas.</div>
                    <div class="info-box">
                        <strong style="color:var(--seguro)">🛡️ SEGURANÇA:</strong>
                        <p style="margin:5px 0 0 0">Patrulhada por guardas. Baixa chance de encontros hostis.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const locais = {
            "coliseu_do_imperador": { nome: "Coliseu do Imperador", x: 23.76, y: 83.49, regiao: "imperial" },
            "forja_de_hefesto": { nome: "🔥 Forja de Hefesto", x: 9.63, y: 80.66, regiao: "vulcanica" },
            "creta": { nome: "🏝️ Creta", x: 45.33, y: 78.61, regiao: "maritima" },
            "esparta": { nome: "⚔️ Esparta", x: 39.19, y: 82.51, regiao: "militar" },
            "corintos": { nome: "💰 Corintos", x: 42.25, y: 71.38, regiao: "civilizada" },
            "tebas": { nome: "🧠 Tebas", x: 50.91, y: 78.12, regiao: "civilizada" },
            "temicera": { nome: "🏝️ Temicera", x: 49.54, y: 55.56, regiao: "amazonas" },
            "atenas": { nome: "🏛️ Atenas", x: 23.24, y: 53.80, regiao: "civilizada" },
            "templo_de_atena": { nome: "🏛️ Templo de Atena", x: 25.84, y: 58.10, regiao: "sagrada" },
            "templo_de_zeus": { nome: "⚡ Templo de Zeus", x: 28.64, y: 51.46, regiao: "sagrada" },
            "templo_de_apolo": { nome: "☀️ Templo de Apolo (Oraculo)", x: 25.91, y: 68.06, regiao: "sagrada" },
            "delfos": { nome: "🔮 Delfos", x: 31.25, y: 62.59, regiao: "sagrada" },
            "meteora": { nome: "☁️ Meteora", x: 24.60, y: 44.04, regiao: "montanhosa" },
            "coliseu_olimpico": { nome: "🏟️ Coliseu Olímpico", x: 18.81, y: 50.29, regiao: "imperial" },
            "palacio_alexandre": { nome: "🏛️ Palácio de Alexandre", x: 28.45, y: 15.33, regiao: "imperial" },
            "templo_de_ares": { nome: "⚔️ Templo de Ares", x: 14.45, y: 26.46, regiao: "sagrada" },
            "exercito_imperial": { nome: "⚔️ Exército Imperial", x: 19.33, y: 18.65, regiao: "imperial" },
            "anfiteatro_dionisio": { nome: "🎭 Anfiteatro de Dionísio", x: 29.81, y: 37.98, regiao: "civilizada" },
            "kruma": { nome: "🌑🔥 Kruma", x: 36.45, y: 34.96, regiao: "militar" },
            "alexandria": { nome: "🏛️📜 Alexandria", x: 43.48, y: 45.37, regiao: "civilizada" },
            "troia": { nome: "🏛️🔥 Troia", x: 47.52, y: 27.05, regiao: "militar" },
            "ilha_nekroth": { nome: "🌑🪦 Ilha de Nekroth", x: 59.50, y: 45.31, regiao: "sombria" },
            "necropolis": { nome: "🪦🌑 Necrópolis", x: 58.85, y: 50.09, regiao: "sombria" },
            "ilhas_galapagus": { nome: "🌿🌍 Ilhas de Galapagus", x: 55.03, y: 66.60, regiao: "maritima" },
            "itaca": { nome: "🏝️🛡️ Ítaca", x: 60.98, y: 89.94, regiao: "maritima" },
            "ilha_ciclopes": { nome: "🗿🔥 Ilha dos Ciclopes", x: 7.48, y: 67.48, regiao: "maritima" },
            "trinacia": { nome: "☀️🐂 Trinácia", x: 40.03, y: 56.15, regiao: "maritima" },
            "esqueria": { nome: "🌊✨ Esquéria", x: 58.83, y: 34.57, regiao: "maritima" },
            "ilha_karceros": { nome: "⛓️🔥 Ilha de Karceros", x: 26.56, y: 89.16, regiao: "maritima" }
        };

        const perigosRegiao = {
            "civilizada": "Ladrões comuns e batedores de carteira.",
            "sagrada": "Sentinelas divinas e golens de mármore.",
            "imperial": "Patrulhas imperiais rigorosas e taxas de passagem.",
            "vulcanica": "Feras de magma e fumaça tóxica.",
            "sombria": "Aparições e mortos-vivos na neblina.",
            "maritima": "Piratas, sereias e monstros marinhos.",
            "militar": "Espiões de guerra e patrulhas blindadas.",
            "amazonas": "Arqueiras letais e armadilhas de selva.",
            "montanhosa": "Wyverns e avalanches perigosas."
        };

        window.addEventListener('DOMContentLoaded', () => {
            const partida = document.getElementById('partida');
            const chegada = document.getElementById('chegada');
            Object.keys(locais).sort((a,b) => locais[a].nome.localeCompare(locais[b].nome)).forEach(chave => {
                partida.add(new Option(locais[chave].nome, chave));
                chegada.add(new Option(locais[chave].nome, chave));
            });
            partida.value = "atenas"; chegada.value = "esparta";
        });

        function calcularViagem() {
            const o = locais[document.getElementById('partida').value];
            const d = locais[document.getElementById('chegada').value];
            const t = document.querySelector('input[name="transporte"]:checked').value;

            if (o === d) { alert("Escolha pontos diferentes!"); return; }

            const dist = Math.sqrt(Math.pow(o.x - d.x, 2) + Math.pow(o.y - d.y, 2));
            const fator = (t === "cavalo") ? 0.175 : 0.35;
            
            const diasRapida = dist * fator;
            const diasSegura = diasRapida * 1.5;

            document.getElementById('tempo-rapida').textContent = formatar(diasRapida);
            document.getElementById('tempo-segura').textContent = formatar(diasSegura);
            document.getElementById('resumo-origem').textContent = o.nome;
            document.getElementById('resumo-destino').textContent = d.nome;
            document.getElementById('perigos-texto').textContent = perigosRegiao[d.regiao] || "Monstros errantes.";
            document.getElementById('resultado').style.display = 'flex';
        }

        function formatar(d) {
            const dias = Math.floor(d);
            const horas = Math.round((d - dias) * 24);
            return dias > 0 ? `${dias}d ${horas}h` : `${horas}h`;
        }
    </script>
</body>
</html>
