<head><meta charset="UTF-8"><style>
    body { background: #000; color: white; margin: 0; font-family: sans-serif; }

            <div class="marker-wrapper" style="left:23.763020833333336%; top:83.49609375%">
                <div class="marker-label">Coliseu do Imperador</div>
                <div class="marker" onclick="show('Coliseu do Imperador', 'imagens/loc_0.png', '🏛️ Coliseu do Imperador<br><br>Enterrado nas profundezas do império, longe da luz do sol e dos olhos dos deuses, o Coliseu do Imperador não é apenas uma arena… é uma máquina de sofrimento.<br><br>Esculpido diretamente na rocha, o coliseu é colossal. Seu formato circular lembra os grandes anfiteatros da superfície, mas aqui tudo é mais brutal, mais opressor. As paredes são feitas de pedra negra reforçada com metal, marcadas por rachaduras antigas e manchas escuras que nunca foram limpas.<br><br>Arquibancadas gigantescas se elevam em camadas, sustentadas por colunas grossas e pesadas. Acima delas, grades de ferro e passarelas permitem que guardas circulem constantemente, sempre observando. Tochas e braseiros iluminam o local com uma luz alaranjada e instável, criando sombras que se movem como se estivessem vivas.<br><br>No topo, existe uma área isolada e luxuosa: o camarote imperial. Decorado com ouro, tapeçarias e símbolos de poder, é de lá que representantes do império assistem às lutas — protegidos, confortáveis… indiferentes.<br><br>⚔️ A Arena<br><br>O centro do coliseu é um campo de batalha irregular, coberto por areia grossa misturada com sangue seco. Partes do chão são feitas de placas móveis, permitindo armadilhas:<br><br>Portões que se abrem de repente<br>Grades que se fecham<br>Espinhos que emergem do solo<br>Plataformas que afundam<br><br>Correntes pesadas ficam presas ao redor da arena, usadas para prender criaturas ou escravos antes do combate.<br><br>Há marcas profundas nas paredes — garras, impactos, queimaduras mágicas. Isso não é um lugar de espetáculo… é um lugar onde coisas impossíveis já aconteceram.<br><br>⛓️ As Entranhas do Coliseu<br><br>Abaixo da arena existe um verdadeiro labirinto subterrâneo:<br><br>Celas dos Escravos<br>Pequenas, úmidas e superlotadas. Correntes presas às paredes. O cheiro de ferrugem, suor e desespero é constante. Aqui, os personagens começam — fracos, exaustos, mas vivos.<br><br>Corredores de Transporte<br>Túneis estreitos por onde escravos são arrastados até a arena. Marcas no chão mostram resistência… e fracasso.<br><br>Jaulas de Criaturas<br>Estruturas reforçadas com ferro espesso e runas antigas. Algumas coisas presas ali… não deveriam existir. Rugidos ecoam constantemente.<br><br>Sala dos Controladores<br>Um conjunto de mecanismos, alavancas e engrenagens que controlam a arena. Guardas e engenheiros operam armadilhas durante os combates.<br><br>Câmara de Execução<br>Para aqueles que não servem mais. Sem espetáculo. Sem plateia.<br><br>🩸 O Que é Feito Lá<br><br>O Coliseu do Imperador existe por três motivos principais:<br><br>1. Entretenimento Brutal<br>A elite do império assiste batalhas entre:<br><br>Escravos vs escravos<br>Escravos vs criaturas<br>Criaturas vs heróis<br>Execuções públicas<br><br>Não há honra. Apenas sobrevivência.<br><br>2. Controle pelo Medo<br>O império usa o coliseu como símbolo:<br><br>“É isso que acontece com quem não obedece.”<br><br>Rebeldes, descendentes de sangue antigo e qualquer um considerado “perigoso” acaba aqui.<br><br>3. Estudo de Poderes Proibidos<br>Esse é o segredo mais sombrio.<br><br>O império captura:<br><br>Descendentes de gigantes<br>Portadores de energia primordial<br>Criaturas antigas<br><br>Eles observam, testam, forçam combates… tudo para entender e, eventualmente, controlar esses poderes.<br><br>🔥 Atmosfera<br>O ar é pesado, quente e seco<br>O som nunca para: gritos, correntes, rugidos<br>A sensação constante é de vigilância<br>Ninguém entra ali como pessoa… apenas como recurso<br>💀 Verdade Oculta<br><br>Dizem que o Coliseu não foi construído apenas para entretenimento.<br><br>Algo abaixo dele pulsa.<br><br>Algo antigo.<br><br>Algo que reage à energia liberada nas batalhas.')"></div>
            </div>
            <div class="marker-wrapper" style="left:9.635416666666668%; top:80.6640625%">
                <div class="marker-label">🔥 Forja de Hefesto</div>
                <div class="marker" onclick="show('🔥 Forja de Hefesto', 'imagens/loc_1.png', '🔥 Forja de Hefesto<br><br>No horizonte do mar revolto, existe um lugar que marinheiros evitam até mencionar.<br><br>Uma ilha negra. Irregular. Viva.<br><br>A Forja de Hefesto não é apenas uma ilha — é uma cicatriz no mundo.<br><br>🌋 A Ilha<br><br>Erguendo-se das águas como uma besta adormecida, a ilha é formada por rochas vulcânicas afiadas, penhascos impossíveis e praias de areia escura que parecem cinzas de algo muito antigo.<br><br>O mar ao redor nunca é calmo.<br><br>Correntes violentas, redemoinhos e vapores quentes emergem da água, como se o próprio oceano estivesse sendo fervido por algo abaixo.<br><br>Navios que se aproximam relatam:<br><br>bússolas girando sem controle<br>o ar ficando pesado e quente<br>sons metálicos ecoando… mesmo no meio do mar<br><br>Poucos chegam perto.<br><br>Nenhum retorna.<br><br>🔥 O Vulcão<br><br>No centro da ilha, dominando toda a paisagem, está um vulcão colossal.<br><br>Ele nunca dorme.<br><br>Rios de lava escorrem lentamente por suas encostas, iluminando a ilha durante a noite com um brilho infernal. Cinzas caem constantemente como uma neve negra, cobrindo tudo — pedras, ossos… e coisas piores.<br><br>Mas o mais estranho não é a erupção.<br><br>É o ritmo.<br><br>O vulcão pulsa.<br><br>Como uma fornalha sendo alimentada.<br><br>Como um coração… batendo.<br><br>⚒️ A Lenda<br><br>Antigas histórias dizem que ali é a verdadeira forja de Hefesto, o deus artesão dos deuses.<br><br>Um lugar onde:<br><br>armas divinas foram criadas<br>correntes capazes de prender deuses foram forjadas<br>artefatos impossíveis ganharam forma<br><br>Mas isso… nunca foi comprovado.<br><br>Porque ninguém que pisa na ilha volta.<br><br>🐉 As Criaturas<br><br>A ilha não é vazia.<br><br>Ela é infestada.<br><br>Criaturas moldadas pelo calor, pela pedra e por algo mais antigo:<br><br>Bestas de obsidiana com sangue incandescente<br>Serpentes que rastejam pela lava como água<br>Gigantes deformados, como experimentos falhos<br>Sombras vivas que habitam cavernas profundas<br><br>Não são apenas monstros.<br><br>São guardiões.<br><br>Ou… rejeitos.<br><br>⛓️ As Cavernas<br><br>Espalhadas pela ilha existem entradas para túneis profundos, que descem em direção ao coração do vulcão.<br><br>Lá dentro:<br><br>o calor se torna insuportável<br>o ar vibra como metal sendo martelado<br>ecos de golpes ritmados podem ser ouvidos<br><br>Alguns dizem que são apenas sons naturais.<br><br>Outros dizem…<br><br>que alguém ainda está trabalhando.<br><br>💀 O Mistério<br><br>Fragmentos de metal estranho já foram encontrados flutuando no mar próximo à ilha.<br><br>Armas quebradas.<br><br>Partes de armaduras.<br><br>Correntes.<br><br>Tudo com uma característica em comum:<br><br>Não enferrujam.<br>Não quebram facilmente.<br>E parecem… vivos.<br><br>🔥 Verdade Sussurrada<br><br>Alguns acreditam que a ilha não foi abandonada.<br><br>Que Hefesto nunca parou.<br><br>Que ele continua forjando.<br><br>Mas não para os deuses.<br><br>Para algo novo.<br><br>Algo que não deveria existir nesse mundo sem intervenção divina.')"></div>
            </div>
            <div class="marker-wrapper" style="left:47.87326405445735%; top:56.96614682674408%">
                <div class="marker-label">🏝️ Temicera</div>
                <div class="marker" onclick="show('🏝️ Temicera', 'imagens/loc_2.png', 'A Ilha das Guerreiras Eternas<br><br>Escondida além de nevoeiros densos e correntes traiçoeiras, Temicera não aparece em mapas comuns.<br><br>Não por acaso.<br><br>Mas por escolha.<br><br>A ilha é um santuário… e uma fortaleza.<br><br>Um lugar onde o mundo dos mortais não dita as regras.<br><br>👑 A Rainha<br><br>Temicera é governada por Hipólita, a Rainha das Amazonas.<br><br>Diferente das histórias antigas, nesta era ela não é apenas uma líder — ela é uma sobrevivente do mundo antes do Decreto Divino.<br><br>Hipólita governa com:<br><br>disciplina absoluta<br>sabedoria adquirida em séculos de guerra<br>e uma desconfiança profunda do mundo exterior<br><br>Ela acredita que o mundo dos homens está corrompido… e que Temicera é a última chama de ordem verdadeira.<br><br>⚖️ Leis de Temicera<br><br>A ilha não é apenas protegida por armas… mas por leis rígidas.<br><br>1. Nenhum homem pisa em Temicera<br>Qualquer homem que chegue à ilha:<br><br>é executado<br>ou, em casos raros, usado como moeda política<br><br>2. Força define posição<br>Hierarquia não é herdada — é conquistada:<br><br>desafios são comuns<br>derrotas são respeitadas<br>fraqueza constante não é tolerada<br><br>3. Lealdade acima de tudo<br>Traição é o maior crime.<br>A punição:<br><br>exílio… ou morte<br><br>4. O mundo exterior é proibido<br>Amazonas não podem sair livremente.<br>Apenas:<br><br>emissárias<br>ou guerreiras em missões específicas<br>🚫 Proibições<br>Uso de magia instável ou desconhecida<br>Relíquias de origem divina não autorizadas<br>Contato com impérios escravistas (como o do seu prólogo)<br>Qualquer tentativa de quebrar o isolamento da ilha<br>🏛️ A Ilha<br><br>Temicera é um contraste impressionante:<br><br>Florestas densas e vivas<br>Montanhas usadas como campos de treinamento<br>Praias de areia branca protegidas por falésias<br>Templos antigos dedicados a forças esquecidas<br><br>Nada ali é decadente.<br><br>Tudo é mantido com perfeição.<br><br>⚔️ As Guerreiras<br><br>As Amazonas não são apenas combatentes.<br><br>São:<br><br>estrategistas<br>caçadoras<br>artesãs de guerra<br><br>Cada uma treina desde criança.<br><br>Cada uma está pronta para lutar.<br><br>📜 Lendas de Temicera<br>🌙 A Ilha que Desaparece<br><br>Dizem que Temicera não está sempre no mesmo lugar.<br><br>Alguns acreditam que:<br><br>a ilha se move<br>ou está protegida por forças antigas<br><br>Navios que tentam encontrá-la muitas vezes:<br><br>retornam ao mesmo ponto<br>ou desaparecem completamente<br>🩸 O Sangue Antigo<br><br>Há rumores de que as Amazonas carregam um sangue diferente.<br><br>Não apenas humano.<br><br>Algo antigo.<br><br>Algo ligado às primeiras eras — talvez até anterior aos deuses atuais.<br><br>⚔️ A Última Guerra<br><br>Uma profecia circula entre as mais velhas:<br><br>“Quando o mundo esquecer o medo dos deuses… Temicera será forçada a lembrar.”<br><br>🌍 Importância no Mundo<br><br>Temicera não é apenas uma ilha isolada.<br><br>Ela é:<br><br>🛡️ Um Bastião<br><br>Um dos poucos lugares que:<br><br>não caiu sob controle imperial<br>não depende dos deuses<br>⚖️ Um Equilíbrio<br><br>Enquanto o mundo mergulha no caos sem intervenção divina, Temicera mantém:<br><br>ordem<br>tradição<br>força<br>🔥 Um Possível Conflito<br><br>O império sabe da existência da ilha.<br><br>E teme.<br><br>Porque:<br><br>não pode controlá-la<br>não pode invadi-la facilmente<br>e não entende seu poder<br>💀 Verdade Oculta<br><br>Hipólita sabe de algo que não revela.<br><br>Algo sobre o Decreto Divino.<br><br>Algo sobre o motivo de os deuses terem parado.<br><br>E talvez…<br><br>Temicera não esteja apenas se protegendo do mundo.<br><br>Mas preparando-se para quando ele finalmente quebrar.')"></div>
            </div>
            <div class="marker-wrapper" style="left:45.33420130610466%; top:78.61328125%">
                <div class="marker-label">🏝️ Creta</div>
                <div class="marker" onclick="show('🏝️ Creta', 'imagens/loc_3.png', 'A Ilha das Três Coroas<br><br>No coração do mar, entre rotas comerciais e zonas de guerra, ergue-se Creta.<br><br>Diferente de qualquer outra ilha, Creta não pertence a um único povo… nem a um único ideal.<br><br>Ela é dividida.<br><br>Três cidades.<br>Três filosofias.<br>Três forças que coexistem… à beira da guerra.<br><br>Dizem que a ilha foi moldada por antigos conflitos — e que algo sob sua terra ainda lembra disso.<br><br>⚔️ Esparta — A Cidade da Guerra<br><br>Ao sul da ilha, cercada por montanhas naturais e campos áridos, está Esparta.<br><br>Nada ali é feito para beleza.<br><br>Tudo é feito para sobreviver.<br><br>Características:<br>Fortificações pesadas e simples<br>Campos de treino ao ar livre<br>Pouca arquitetura decorativa<br>Disciplina absoluta<br>Cultura:<br><br>Aqui, fraqueza não é tolerada.<br><br>Crianças são treinadas desde cedo.<br>Adultos vivem para a guerra.<br>Velhos contam histórias… ou morrem tentando provar que ainda são úteis.<br><br>Governo:<br><br>Um conselho de generais.<br><br>O mais forte lidera.<br>Até deixar de ser.<br><br>🏛️ Corintos — A Cidade da Riqueza<br><br>Na costa oeste, com acesso direto ao mar, está Corintos.<br><br>É a cidade mais viva da ilha.<br><br>E a mais perigosa… de outra forma.<br><br>Características:<br>Portos movimentados<br>Mercados gigantescos<br>Construções luxuosas<br>Influência estrangeira constante<br>Cultura:<br><br>Tudo tem preço.<br><br>Informação, armas, favores… até pessoas.<br><br>Corintos não luta guerras.<br><br>Ela as financia.<br><br>Governo:<br><br>Um conselho de mercadores.<br><br>Quem controla o ouro… controla a cidade.<br><br>🧠 Tebas — A Cidade do Conhecimento<br><br>Ao norte, cercada por florestas e ruínas antigas, está Tebas.<br><br>Silenciosa. Observadora. Misteriosa.<br><br>Características:<br>Bibliotecas e templos antigos<br>Ruínas muito mais antigas que a própria cidade<br>Torres de estudo e observação<br>Pouco movimento externo<br>Cultura:<br><br>Aqui, o poder não está na força… nem no ouro.<br><br>Mas no conhecimento.<br><br>Magia, estratégia, história esquecida — tudo é estudado.<br><br>Governo:<br><br>Um círculo de sábios.<br><br>Eles não governam com exércitos…<br>Governam com previsões.<br><br>⚖️ O Equilíbrio Frágil<br><br>As três cidades coexistem por necessidade.<br><br>Esparta precisa dos recursos de Corintos<br>Corintos precisa da proteção de Esparta<br>Tebas precisa de ambas… para continuar estudando<br><br>Mas a tensão é constante.<br><br>Qualquer erro… pode iniciar uma guerra que destruiria a ilha inteira.<br><br>🐂 Lendas de Creta<br>🌀 O Labirinto Esquecido<br><br>Sob a ilha, dizem existir um labirinto antigo.<br><br>Não construído por humanos.<br><br>Mas por algo mais antigo.<br><br>Alguns acreditam que:<br><br>ele conecta as três cidades<br>ou que guarda uma criatura… ainda viva<br>🩸 O Coração da Ilha<br><br>Há rumores de que Creta não é apenas terra comum.<br><br>Que abaixo dela existe uma fonte de energia primordial.<br><br>Talvez ligada ao mesmo poder do Evento.<br><br>👁️ A Cidade que Caiu<br><br>Registros antigos falam de uma quarta cidade.<br><br>Mais poderosa que todas.<br><br>Mas que desapareceu da noite para o dia.<br><br>Tebas nega.<br><br>Esparta não fala.<br><br>Corintos vende a informação… mas ninguém acredita.<br><br>🌍 Importância no Mundo<br><br>Creta é uma das ilhas mais importantes do cenário:<br><br>⚔️ Militar<br><br>Esparta forma alguns dos melhores guerreiros vivos.<br><br>💰 Econômica<br><br>Corintos controla rotas comerciais vitais.<br><br>🔮 Arcana<br><br>Tebas guarda conhecimentos que podem mudar o mundo.<br><br>💀 Verdade Oculta<br><br>As três cidades acreditam estar no controle.<br><br>Mas talvez nenhuma delas esteja.<br><br>Porque algo sob Creta observa.<br><br>Algo antigo.<br><br>Algo que já viu impérios surgirem… e caírem.<br><br>E talvez esteja apenas esperando…<br><br>a próxima guerra começar.')"></div>
            </div>
            <div class="marker-wrapper" style="left:39.19270833333333%; top:82.51953125%">
                <div class="marker-label">⚔️ Esparta</div>
                <div class="marker" onclick="show('⚔️ Esparta', 'imagens/loc_4.png', 'A Cidade que Nunca se Curva<br><br>Erguida entre montanhas áridas e vales de pedra, Esparta não é uma cidade construída para impressionar.<br><br>Ela é construída para resistir.<br><br>Suas muralhas são simples, grossas e eficientes. Suas ruas são largas o suficiente para marchas, mas sem qualquer luxo. Não há estátuas grandiosas nem templos exuberantes.<br><br>Em Esparta, beleza é fraqueza.<br><br>Força… é tudo.<br><br>👑 O Rei de Esparta<br><br>Esparta é governada por Drakion, conhecido como O Inquebrável.<br><br>Drakion não herdou o trono.<br><br>Ele o conquistou.<br><br>Antigo campeão da arena e general de guerra, ele desafiou o antigo rei — e venceu diante de toda a cidade.<br><br>Desde então, governa com punho firme e visão clara:<br><br>“Esparta não precisa de deuses… apenas de guerreiros.”<br><br>Ele lidera pelo exemplo:<br><br>luta ao lado de seus soldados<br>participa de treinos<br>nunca delega aquilo que pode fazer com a própria lâmina<br><br>Mas há algo inquietante sobre ele…<br><br>Dizem que Drakion nunca se cansa.<br>Nunca adoece.<br>E já sobreviveu a ferimentos que matariam qualquer homem.<br><br>⚖️ Política de Esparta<br><br>Esparta segue uma filosofia simples:<br><br>Força define valor.<br><br>A estrutura de poder é dividida em três pilares:<br><br>🛡️ O Rei<br><br>Líder absoluto em tempos de guerra — o que, em Esparta, é quase sempre.<br><br>⚔️ Conselho de Generais<br><br>Veteranos que já provaram seu valor em combate.<br><br>Eles aconselham o rei… mas nunca o contradizem por muito tempo.<br><br>🩸 O Povo<br><br>Não há cidadãos comuns.<br><br>Apenas:<br><br>guerreiros<br>aprendizes<br>ou aqueles que ainda precisam provar que merecem viver ali<br>🔥 Costumes Espartanos<br><br>Esparta não vive… ela treina.<br><br>👶 Nascimento<br><br>Recém-nascidos são avaliados.<br><br>Se forem considerados fracos:<br><br>são abandonados nas montanhas<br>🧒 Infância<br><br>Crianças são retiradas de suas famílias cedo.<br><br>São criadas pelo Estado:<br><br>treinadas<br>testadas<br>endurecidas<br>⚔️ Vida Adulta<br><br>Ser espartano é:<br><br>lutar<br>obedecer<br>sobreviver<br><br>Comida é escassa de propósito.<br>Dor é comum.<br>Compaixão é rara.<br><br>💀 Morte<br><br>A única morte honrada é em combate.<br><br>Qualquer outra… é esquecimento.<br><br>🐺 Lendas de Esparta<br>🩸 O Rei que Não Cai<br><br>Dizem que Drakion não é apenas humano.<br><br>Alguns acreditam que:<br><br>ele carrega sangue de gigantes<br>ou foi tocado pela energia primordial.<br><br>Outros dizem algo pior…<br><br>Que ele já morreu uma vez.<br>E voltou.<br><br>⚔️ O Campo dos Mil Mortos<br><br>Nos arredores da cidade existe um campo de batalha antigo.<br><br>Nenhuma vegetação cresce ali.<br><br>Durante a noite, dizem que:<br><br>sombras lutam novamente<br>sons de espadas ecoam no vazio<br><br>E qualquer um que durma ali… acorda diferente.<br><br>Se acordar.<br><br>🐗 A Provação da Montanha Negra<br><br>Todo guerreiro deve sobreviver uma noite sozinho em uma montanha próxima.<br><br>Mas a montanha não é comum.<br><br>Algo vive lá.<br><br>Poucos falam sobre o que enfrentaram.<br>Mas todos voltam… mudados.<br><br>Ou não voltam.<br><br>🌍 Importância no Mundo<br><br>Esparta é uma das maiores forças militares existentes.<br><br>O império teme seus guerreiros<br>Mercenários tentam imitá-los<br>Outras cidades… evitam provocá-los<br><br>Sem os deuses, Esparta representa algo perigoso:<br><br>Um mundo onde apenas a força decide o destino.<br><br>💀 Verdade Oculta<br><br>Esparta acredita que se libertou dos deuses.<br><br>Mas talvez…<br><br>tenha apenas trocado de mestre.<br><br>Porque há rumores de que algo antigo observa a cidade.<br><br>Algo que se alimenta de guerra.<br><br>E enquanto Esparta continuar lutando…<br><br>isso continuará crescendo.')"></div>
            </div>
