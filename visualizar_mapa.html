
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa RPG</title>
    <style>
        body { background: #000; color: white; margin: 0; font-family: sans-serif; }
        #viewport { width: 100vw; height: 100vh; overflow: auto; display: flex; align-items: flex-start; justify-content: flex-start; }
        #map-container { position: relative; display: inline-block; line-height: 0; }
        #map-container img.base { display: block; max-width: none; height: auto; }
        .marker-wrapper { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 10; }
        .marker-label { background: rgba(0,0,0,0.85); color: #38bdf8; padding: 4px 10px; border-radius: 4px; font-size: 14px; margin-bottom: 6px; border: none; white-space: nowrap; font-weight: bold; }
        .marker { width: 22px; height: 22px; background: #38bdf8; border: 2px solid white; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); cursor: pointer; pointer-events: auto; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .content { background: #1e293b; padding: 25px; border-radius: 12px; max-width: 600px; width: 100%; border: 1px solid #38bdf8; position: relative; box-sizing: border-box; }
        .content img { width: 100%; border-radius: 8px; margin-top: 15px; border: 1px solid #334155; }
        .close { position: absolute; top: 5px; right: 15px; cursor: pointer; font-size: 35px; color: #38bdf8; font-weight: bold; }
        #scroll-box { max-height: 70vh; overflow-y: auto; margin-top: 10px; padding-right: 10px; color: #cbd5e1; }
        @media (max-width: 768px) { .marker-label { font-size: 16px; } .marker { width: 26px; height: 26px; } }
    </style>

                <div class="marker-wrapper" style="left:23.763020833333336%; top:83.49609375%">
                    <div class="marker-label">Coliseu do Imperador</div>
                    <div class="marker" onclick="show('Coliseu do Imperador', 'imagens/loc_0.png', '🏛️ Coliseu do Imperador<br><br>Enterrado nas profundezas do império, longe da luz do sol e dos olhos dos deuses, o Coliseu do Imperador não é apenas uma arena… é uma máquina de sofrimento.<br><br>Esculpido diretamente na rocha, o coliseu é colossal. Seu formato circular lembra os grandes anfiteatros da superfície, mas aqui tudo é mais brutal, mais opressor. As paredes são feitas de pedra negra reforçada com metal, marcadas por rachaduras antigas e manchas escuras que nunca foram limpas.<br><br>Arquibancadas gigantescas se elevam em camadas, sustentadas por colunas grossas e pesadas. Acima delas, grades de ferro e passarelas permitem que guardas circulem constantemente, sempre observando. Tochas e braseiros iluminam o local com uma luz alaranjada e instável, criando sombras que se movem como se estivessem vivas.<br><br>No topo, existe uma área isolada e luxuosa: o camarote imperial. Decorado com ouro, tapeçarias e símbolos de poder, é de lá que representantes do império assistem às lutas — protegidos, confortáveis… indiferentes.<br><br>⚔️ A Arena<br><br>O centro do coliseu é um campo de batalha irregular, coberto por areia grossa misturada com sangue seco. Partes do chão são feitas de placas móveis, permitindo armadilhas:<br><br>Portões que se abrem de repente<br>Grades que se fecham<br>Espinhos que emergem do solo<br>Plataformas que afundam<br><br>Correntes pesadas ficam presas ao redor da arena, usadas para prender criaturas ou escravos antes do combate.<br><br>Há marcas profundas nas paredes — garras, impactos, queimaduras mágicas. Isso não é um lugar de espetáculo… é um lugar onde coisas impossíveis já aconteceram.<br><br>⛓️ As Entranhas do Coliseu<br><br>Abaixo da arena existe um verdadeiro labirinto subterrâneo:<br><br>Celas dos Escravos<br>Pequenas, úmidas e superlotadas. Correntes presas às paredes. O cheiro de ferrugem, suor e desespero é constante. Aqui, os personagens começam — fracos, exaustos, mas vivos.<br><br>Corredores de Transporte<br>Túneis estreitos por onde escravos são arrastados até a arena. Marcas no chão mostram resistência… e fracasso.<br><br>Jaulas de Criaturas<br>Estruturas reforçadas com ferro espesso e runas antigas. Algumas coisas presas ali… não deveriam existir. Rugidos ecoam constantemente.<br><br>Sala dos Controladores<br>Um conjunto de mecanismos, alavancas e engrenagens que controlam a arena. Guardas e engenheiros operam armadilhas durante os combates.<br><br>Câmara de Execução<br>Para aqueles que não servem mais. Sem espetáculo. Sem plateia.<br><br>🩸 O Que é Feito Lá<br><br>O Coliseu do Imperador existe por três motivos principais:<br><br>1. Entretenimento Brutal<br>A elite do império assiste batalhas entre:<br><br>Escravos vs escravos<br>Escravos vs criaturas<br>Criaturas vs heróis<br>Execuções públicas<br><br>Não há honra. Apenas sobrevivência.<br><br>2. Controle pelo Medo<br>O império usa o coliseu como símbolo:<br><br>“É isso que acontece com quem não obedece.”<br><br>Rebeldes, descendentes de sangue antigo e qualquer um considerado “perigoso” acaba aqui.<br><br>3. Estudo de Poderes Proibidos<br>Esse é o segredo mais sombrio.<br><br>O império captura:<br><br>Descendentes de gigantes<br>Portadores de energia primordial<br>Criaturas antigas<br><br>Eles observam, testam, forçam combates… tudo para entender e, eventualmente, controlar esses poderes.<br><br>🔥 Atmosfera<br>O ar é pesado, quente e seco<br>O som nunca para: gritos, correntes, rugidos<br>A sensação constante é de vigilância<br>Ninguém entra ali como pessoa… apenas como recurso<br>💀 Verdade Oculta<br><br>Dizem que o Coliseu não foi construído apenas para entretenimento.<br><br>Algo abaixo dele pulsa.<br><br>Algo antigo.<br><br>Algo que reage à energia liberada nas batalhas.')"></div>
                </div>
                <div class="marker-wrapper" style="left:9.635416666666668%; top:80.6640625%">
                    <div class="marker-label">🔥 Forja de Hefesto</div>
                    <div class="marker" onclick="show('🔥 Forja de Hefesto', 'imagens/loc_1.png', '🔥 Forja de Hefesto<br><br>No horizonte do mar revolto, existe um lugar que marinheiros evitam até mencionar.<br><br>Uma ilha negra. Irregular. Viva.<br><br>A Forja de Hefesto não é apenas uma ilha — é uma cicatriz no mundo.<br><br>🌋 A Ilha<br><br>Erguendo-se das águas como uma besta adormecida, a ilha é formada por rochas vulcânicas afiadas, penhascos impossíveis e praias de areia escura que parecem cinzas de algo muito antigo.<br><br>O mar ao redor nunca é calmo.<br><br>Correntes violentas, redemoinhos e vapores quentes emergem da água, como se o próprio oceano estivesse sendo fervido por algo abaixo.<br><br>Navios que se aproximam relatam:<br><br>bússolas girando sem controle<br>o ar ficando pesado e quente<br>sons metálicos ecoando… mesmo no meio do mar<br><br>Poucos chegam perto.<br><br>Nenhum retorna.<br><br>🔥 O Vulcão<br><br>No centro da ilha, dominando toda a paisagem, está um vulcão colossal.<br><br>Ele nunca dorme.<br><br>Rios de lava escorrem lentamente por suas encostas, iluminando a ilha durante a noite com um brilho infernal. Cinzas caem constantemente como uma neve negra, cobrindo tudo — pedras, ossos… e coisas piores.<br><br>Mas o mais estranho não é a erupção.<br><br>É o ritmo.<br><br>O vulcão pulsa.<br><br>Como uma fornalha sendo alimentada.<br><br>Como um coração… batendo.<br><br>⚒️ A Lenda<br><br>Antigas histórias dizem que ali é a verdadeira forja de Hefesto, o deus artesão dos deuses.<br><br>Um lugar onde:<br><br>armas divinas foram criadas<br>correntes capazes de prender deuses foram forjadas<br>artefatos impossíveis ganharam forma<br><br>Mas isso… nunca foi comprovado.<br><br>Porque ninguém que pisa na ilha volta.<br><br>🐉 As Criaturas<br><br>A ilha não é vazia.<br><br>Ela é infestada.<br><br>Criaturas moldadas pelo calor, pela pedra e por algo mais antigo:<br><br>Bestas de obsidiana com sangue incandescente<br>Serpentes que rastejam pela lava como água<br>Gigantes deformados, como experimentos falhos<br>Sombras vivas que habitam cavernas profundas<br><br>Não são apenas monstros.<br><br>São guardiões.<br><br>Ou… rejeitos.<br><br>⛓️ As Cavernas<br><br>Espalhadas pela ilha existem entradas para túneis profundos, que descem em direção ao coração do vulcão.<br><br>Lá dentro:<br><br>o calor se torna insuportável<br>o ar vibra como metal sendo martelado<br>ecos de golpes ritmados podem ser ouvidos<br><br>Alguns dizem que são apenas sons naturais.<br><br>Outros dizem…<br><br>que alguém ainda está trabalhando.<br><br>💀 O Mistério<br><br>Fragmentos de metal estranho já foram encontrados flutuando no mar próximo à ilha.<br><br>Armas quebradas.<br><br>Partes de armaduras.<br><br>Correntes.<br><br>Tudo com uma característica em comum:<br><br>Não enferrujam.<br>Não quebram facilmente.<br>E parecem… vivos.<br><br>🔥 Verdade Sussurrada<br><br>Alguns acreditam que a ilha não foi abandonada.<br><br>Que Hefesto nunca parou.<br><br>Que ele continua forjando.<br><br>Mas não para os deuses.<br><br>Para algo novo.<br><br>Algo que não deveria existir nesse mundo sem intervenção divina.')"></div>
                </div>
                <div class="marker-wrapper" style="left:45.33420130610466%; top:78.61328125%">
                    <div class="marker-label">🏝️ Creta</div>
                    <div class="marker" onclick="show('🏝️ Creta', 'imagens/loc_2.png', 'A Ilha das Três Coroas<br><br>No coração do mar, entre rotas comerciais e zonas de guerra, ergue-se Creta.<br><br>Diferente de qualquer outra ilha, Creta não pertence a um único povo… nem a um único ideal.<br><br>Ela é dividida.<br><br>Três cidades.<br>Três filosofias.<br>Três forças que coexistem… à beira da guerra.<br><br>Dizem que a ilha foi moldada por antigos conflitos — e que algo sob sua terra ainda lembra disso.<br><br>⚔️ Esparta — A Cidade da Guerra<br><br>Ao sul da ilha, cercada por montanhas naturais e campos áridos, está Esparta.<br><br>Nada ali é feito para beleza.<br><br>Tudo é feito para sobreviver.<br><br>Características:<br>Fortificações pesadas e simples<br>Campos de treino ao ar livre<br>Pouca arquitetura decorativa<br>Disciplina absoluta<br>Cultura:<br><br>Aqui, fraqueza não é tolerada.<br><br>Crianças são treinadas desde cedo.<br>Adultos vivem para a guerra.<br>Velhos contam histórias… ou morrem tentando provar que ainda são úteis.<br><br>Governo:<br><br>Um conselho de generais.<br><br>O mais forte lidera.<br>Até deixar de ser.<br><br>🏛️ Corintos — A Cidade da Riqueza<br><br>Na costa oeste, com acesso direto ao mar, está Corintos.<br><br>É a cidade mais viva da ilha.<br><br>E a mais perigosa… de outra forma.<br><br>Características:<br>Portos movimentados<br>Mercados gigantescos<br>Construções luxuosas<br>Influência estrangeira constante<br>Cultura:<br><br>Tudo tem preço.<br><br>Informação, armas, favores… até pessoas.<br><br>Corintos não luta guerras.<br><br>Ela as financia.<br><br>Governo:<br><br>Um conselho de mercadores.<br><br>Quem controla o ouro… controla a cidade.<br><br>🧠 Tebas — A Cidade do Conhecimento<br><br>Ao norte, cercada por florestas e ruínas antigas, está Tebas.<br><br>Silenciosa. Observadora. Misteriosa.<br><br>Características:<br>Bibliotecas e templos antigos<br>Ruínas muito mais antigas que a própria cidade<br>Torres de estudo e observação<br>Pouco movimento externo<br>Cultura:<br><br>Aqui, o poder não está na força… nem no ouro.<br><br>Mas no conhecimento.<br><br>Magia, estratégia, história esquecida — tudo é estudado.<br><br>Governo:<br><br>Um círculo de sábios.<br><br>Eles não governam com exércitos…<br>Governam com previsões.<br><br>⚖️ O Equilíbrio Frágil<br><br>As três cidades coexistem por necessidade.<br><br>Esparta precisa dos recursos de Corintos<br>Corintos precisa da proteção de Esparta<br>Tebas precisa de ambas… para continuar estudando<br><br>Mas a tensão é constante.<br><br>Qualquer erro… pode iniciar uma guerra que destruiria a ilha inteira.<br><br>🐂 Lendas de Creta<br>🌀 O Labirinto Esquecido<br><br>Sob a ilha, dizem existir um labirinto antigo.<br><br>Não construído por humanos.<br><br>Mas por algo mais antigo.<br><br>Alguns acreditam que:<br><br>ele conecta as três cidades<br>ou que guarda uma criatura… ainda viva<br>🩸 O Coração da Ilha<br><br>Há rumores de que Creta não é apenas terra comum.<br><br>Que abaixo dela existe uma fonte de energia primordial.<br><br>Talvez ligada ao mesmo poder do Evento.<br><br>👁️ A Cidade que Caiu<br><br>Registros antigos falam de uma quarta cidade.<br><br>Mais poderosa que todas.<br><br>Mas que desapareceu da noite para o dia.<br><br>Tebas nega.<br><br>Esparta não fala.<br><br>Corintos vende a informação… mas ninguém acredita.<br><br>🌍 Importância no Mundo<br><br>Creta é uma das ilhas mais importantes do cenário:<br><br>⚔️ Militar<br><br>Esparta forma alguns dos melhores guerreiros vivos.<br><br>💰 Econômica<br><br>Corintos controla rotas comerciais vitais.<br><br>🔮 Arcana<br><br>Tebas guarda conhecimentos que podem mudar o mundo.<br><br>💀 Verdade Oculta<br><br>As três cidades acreditam estar no controle.<br><br>Mas talvez nenhuma delas esteja.<br><br>Porque algo sob Creta observa.<br><br>Algo antigo.<br><br>Algo que já viu impérios surgirem… e caírem.<br><br>E talvez esteja apenas esperando…<br><br>a próxima guerra começar.')"></div>
                </div>
                <div class="marker-wrapper" style="left:39.19270833333333%; top:82.51953125%">
                    <div class="marker-label">⚔️ Esparta</div>
                    <div class="marker" onclick="show('⚔️ Esparta', 'imagens/loc_3.png', 'A Cidade que Nunca se Curva<br><br>Erguida entre montanhas áridas e vales de pedra, Esparta não é uma cidade construída para impressionar.<br><br>Ela é construída para resistir.<br><br>Suas muralhas são simples, grossas e eficientes. Suas ruas são largas o suficiente para marchas, mas sem qualquer luxo. Não há estátuas grandiosas nem templos exuberantes.<br><br>Em Esparta, beleza é fraqueza.<br><br>Força… é tudo.<br><br>👑 O Rei de Esparta<br><br>Esparta é governada por Drakion, conhecido como O Inquebrável.<br><br>Drakion não herdou o trono.<br><br>Ele o conquistou.<br><br>Antigo campeão da arena e general de guerra, ele desafiou o antigo rei — e venceu diante de toda a cidade.<br><br>Desde então, governa com punho firme e visão clara:<br><br>“Esparta não precisa de deuses… apenas de guerreiros.”<br><br>Ele lidera pelo exemplo:<br><br>luta ao lado de seus soldados<br>participa de treinos<br>nunca delega aquilo que pode fazer com a própria lâmina<br><br>Mas há algo inquietante sobre ele…<br><br>Dizem que Drakion nunca se cansa.<br>Nunca adoece.<br>E já sobreviveu a ferimentos que matariam qualquer homem.<br><br>⚖️ Política de Esparta<br><br>Esparta segue uma filosofia simples:<br><br>Força define valor.<br><br>A estrutura de poder é dividida em três pilares:<br><br>🛡️ O Rei<br><br>Líder absoluto em tempos de guerra — o que, em Esparta, é quase sempre.<br><br>⚔️ Conselho de Generais<br><br>Veteranos que já provaram seu valor em combate.<br><br>Eles aconselham o rei… mas nunca o contradizem por muito tempo.<br><br>🩸 O Povo<br><br>Não há cidadãos comuns.<br><br>Apenas:<br><br>guerreiros<br>aprendizes<br>ou aqueles que ainda precisam provar que merecem viver ali<br>🔥 Costumes Espartanos<br><br>Esparta não vive… ela treina.<br><br>👶 Nascimento<br><br>Recém-nascidos são avaliados.<br><br>Se forem considerados fracos:<br><br>são abandonados nas montanhas<br>🧒 Infância<br><br>Crianças são retiradas de suas famílias cedo.<br><br>São criadas pelo Estado:<br><br>treinadas<br>testadas<br>endurecidas<br>⚔️ Vida Adulta<br><br>Ser espartano é:<br><br>lutar<br>obedecer<br>sobreviver<br><br>Comida é escassa de propósito.<br>Dor é comum.<br>Compaixão é rara.<br><br>💀 Morte<br><br>A única morte honrada é em combate.<br><br>Qualquer outra… é esquecimento.<br><br>🐺 Lendas de Esparta<br>🩸 O Rei que Não Cai<br><br>Dizem que Drakion não é apenas humano.<br><br>Alguns acreditam que:<br><br>ele carrega sangue de gigantes<br>ou foi tocado pela energia primordial.<br><br>Outros dizem algo pior…<br><br>Que ele já morreu uma vez.<br>E voltou.<br><br>⚔️ O Campo dos Mil Mortos<br><br>Nos arredores da cidade existe um campo de batalha antigo.<br><br>Nenhuma vegetação cresce ali.<br><br>Durante a noite, dizem que:<br><br>sombras lutam novamente<br>sons de espadas ecoam no vazio<br><br>E qualquer um que durma ali… acorda diferente.<br><br>Se acordar.<br><br>🐗 A Provação da Montanha Negra<br><br>Todo guerreiro deve sobreviver uma noite sozinho em uma montanha próxima.<br><br>Mas a montanha não é comum.<br><br>Algo vive lá.<br><br>Poucos falam sobre o que enfrentaram.<br>Mas todos voltam… mudados.<br><br>Ou não voltam.<br><br>🌍 Importância no Mundo<br><br>Esparta é uma das maiores forças militares existentes.<br><br>O império teme seus guerreiros<br>Mercenários tentam imitá-los<br>Outras cidades… evitam provocá-los<br><br>Sem os deuses, Esparta representa algo perigoso:<br><br>Um mundo onde apenas a força decide o destino.<br><br>💀 Verdade Oculta<br><br>Esparta acredita que se libertou dos deuses.<br><br>Mas talvez…<br><br>tenha apenas trocado de mestre.<br><br>Porque há rumores de que algo antigo observa a cidade.<br><br>Algo que se alimenta de guerra.<br><br>E enquanto Esparta continuar lutando…<br><br>isso continuará crescendo.')"></div>
                </div>
                <div class="marker-wrapper" style="left:42.25260416666667%; top:71.38671875%">
                    <div class="marker-label">💰 Corintos</div>
                    <div class="marker" onclick="show('💰 Corintos', 'imagens/loc_4.png', 'A Cidade Onde Tudo Tem Preço<br><br>Erguida sobre falésias douradas e abraçada por um dos portos mais movimentados do mundo, Corintos é uma cidade que nunca dorme.<br><br>Navios chegam e partem a todo momento.<br>Moedas trocam de mãos mais rápido que palavras.<br>E segredos… valem mais que exércitos.<br><br>Diferente de Esparta, Corintos não demonstra força.<br><br>Ela compra.<br><br>👑 O Governante de Corintos<br><br>Corintos não tem um rei no sentido tradicional.<br><br>Ela é controlada por Aureon Varkas, conhecido como O Senhor das Moedas.<br><br>Oficialmente, ele é apenas o líder do Conselho Mercante.<br><br>Na prática…<br><br>Ele controla tudo.<br><br>Aureon nunca empunhou uma espada em público.<br>Nunca liderou um exército.<br>E mesmo assim… reis evitam cruzar seu caminho.<br><br>Porque ele não vence batalhas.<br><br>Ele decide quem vence.<br><br>⚖️ Política de Corintos<br><br>Corintos funciona sob uma regra simples:<br><br>“Se pode ser comprado… será.”<br><br>🪙 Conselho Mercante<br><br>Formado pelos comerciantes mais ricos da cidade.<br><br>Eles votam decisões importantes, mas:<br><br>votos podem ser comprados<br>decisões podem ser manipuladas<br>e alianças mudam constantemente<br>🕸️ Rede de Influência<br><br>A verdadeira força de Corintos está fora dela.<br><br>A cidade mantém:<br><br>espiões em outras regiões<br>informantes em exércitos<br>contratos com assassinos<br><br>Nada acontece no mundo… sem que Corintos saiba.<br><br>⚔️ Exército Invisível<br><br>Corintos não mantém um grande exército fixo.<br><br>Ela contrata:<br><br>mercenários<br>caçadores<br>aventureiros<br><br>Se precisar de guerra… ela paga por ela.<br><br>🔥 Costumes de Corintos<br>💰 Valor<br><br>Tudo tem preço.<br><br>Informação<br>Lealdade<br>Justiça<br>Vidas<br><br>A pergunta nunca é “se” algo vai acontecer.<br><br>Mas “quanto custa”.<br><br>🎭 Aparência<br><br>A cidade é cheia de luxo:<br><br>roupas finas<br>festas constantes<br>arquitetura grandiosa<br><br>Mas por trás disso…<br><br>Há traição em cada esquina.<br><br>🤝 Acordos<br><br>Palavras não têm valor.<br><br>Contratos sim.<br><br>Quebrar um contrato em Corintos é pior que matar alguém.<br><br>🗡️ Discrição<br><br>Assassinatos acontecem.<br><br>Mas nunca em público.<br><br>Se alguém morre… é porque alguém pagou bem.<br><br>🐍 Lendas de Corintos<br>👁️ O Ouro Vivo<br><br>Dizem que algumas moedas de Corintos são… diferentes.<br><br>Elas:<br><br>nunca desaparecem<br>sempre retornam ao dono original<br>e parecem “observar” quem as possui<br><br>Alguns acreditam que Aureon controla isso.<br><br>Outros dizem que o ouro da cidade… não é natural.<br><br>🕳️ Os Cofres Profundos<br><br>Abaixo da cidade existem cofres antigos.<br><br>Muito mais antigos que Corintos.<br><br>Dizem que:<br><br>nenhum ladrão que entrou saiu<br>portas se movem sozinhas<br>e algo guarda o lugar<br><br>Não por dever.<br><br>Mas por fome.<br><br>🩸 O Homem Sem Sombra<br><br>Uma figura é frequentemente mencionada em sussurros.<br><br>Um assassino que:<br><br>não deixa rastros<br>não falha contratos<br>e nunca foi visto claramente<br><br>Alguns dizem que ele trabalha para Aureon.<br><br>Outros dizem…<br><br>que Aureon trabalha para ele.<br><br>🌍 Importância no Mundo<br><br>Corintos é uma das maiores forças do cenário — mesmo sem exércitos.<br><br>💰 Economia<br><br>Controla rotas comerciais essenciais.<br><br>Se Corintos fechar seus portos…<br><br>reinos inteiros entram em colapso.<br><br>🕸️ Informação<br><br>Nada fica escondido por muito tempo.<br><br>Se existe um segredo…<br><br>Corintos pode encontrá-lo.<br><br>⚖️ Influência<br><br>Ela pode:<br><br>iniciar guerras<br>encerrar conflitos<br>derrubar governantes<br><br>Sem levantar uma espada.<br><br>💀 Verdade Oculta<br><br>Aureon acumulou riqueza demais.<br><br>Informação demais.<br><br>Poder demais.<br><br>E isso levanta uma questão perigosa:<br><br>Quem controla alguém que pode comprar tudo?<br><br>Alguns acreditam que ele fez um acordo.<br><br>Não com deuses.<br><br>Mas com algo mais antigo.<br><br>Algo que entende o valor de uma alma…<br><br>e aceita pagamento.<br><br>🎲 Uso no RPG<br><br>Corintos é perfeita para:<br><br>Campanhas de intriga política<br>Missões de espionagem<br>Contratos duvidosos<br>Escolhas morais difíceis')"></div>

                    <div class="marker" onclick="show('🧠 Tebas', 'imagens/loc_5.png', 'A Cidade que Observa<br><br>Erguida entre florestas antigas e ruínas que ninguém ousa escavar completamente, Tebas não é uma cidade que se impõe pela força… nem pelo ouro.<br><br>Ela se impõe pelo conhecimento.<br><br>Suas construções são altas e estreitas, como torres voltadas ao céu. Bibliotecas ocupam mais espaço que quartéis. E suas ruas são silenciosas — não por paz, mas por atenção constante.<br><br>Em Tebas, tudo é observado.<br><br>👑 O Governante de Tebas<br><br>Tebas é liderada por Orion Thales, conhecido como O Vidente Imóvel.<br><br>Ninguém o vê em público há anos.<br><br>Ainda assim… ele governa.<br><br>Orion não lidera exércitos.<br>Não faz discursos.<br>Não participa de cerimônias.<br><br>Ele prevê.<br><br>Dizem que todas as decisões importantes da cidade já foram escritas por ele… antes mesmo de acontecerem.<br><br>E mais inquietante:<br><br>Há registros que indicam que ele nunca envelheceu.<br><br>⚖️ Política de Tebas<br><br>Tebas não funciona como outras cidades.<br><br>Ela não reage ao mundo.<br><br>Ela se antecipa a ele.<br><br>🔮 Círculo dos Sábios<br><br>Um grupo seleto de estudiosos, magos e estrategistas.<br><br>Eles interpretam:<br><br>visões<br>sinais<br>padrões<br><br>E executam planos baseados nisso.<br><br>📜 Governo por Previsão<br><br>Decisões não são debatidas.<br><br>São reveladas.<br><br>Se algo foi previsto… será feito.<br><br>Questionar uma previsão é visto como ignorância.<br><br>🕰️ Controle do Tempo (Social)<br><br>Tudo em Tebas parece acontecer no momento “certo”.<br><br>crises são evitadas<br>ataques são antecipados<br>mudanças acontecem antes de serem necessárias<br><br>Isso faz com que muitos acreditem que Tebas está sempre… um passo à frente do mundo.<br><br>🔥 Costumes de Tebas<br>📚 Conhecimento é Poder<br><br>Crianças são ensinadas desde cedo:<br><br>leitura<br>lógica<br>percepção<br><br>Força física é secundária.<br><br>A mente é a verdadeira arma.<br><br>👁️ Observação Constante<br><br>Todos observam tudo.<br><br>hábitos<br>padrões<br>mudanças<br><br>Nada passa despercebido por muito tempo.<br><br>🕯️ Silêncio<br><br>Falar demais é sinal de descuido.<br><br>Silêncio é visto como:<br><br>inteligência<br>controle<br>superioridade<br>⚗️ Estudo do Proibido<br><br>Apesar das leis, Tebas investiga coisas que outras cidades evitam:<br><br>energia primordial<br>relíquias antigas<br>fenômenos inexplicáveis<br><br>Porque para eles…<br><br>Ignorar algo perigoso é mais arriscado do que estudá-lo.<br><br>🐍 Lendas de Tebas<br>👁️ O Vidente que Nunca Pisca<br><br>Dizem que Orion Thales não dorme.<br><br>Nunca.<br><br>Que ele permanece imóvel em sua câmara, observando… mesmo de olhos fechados.<br><br>Alguns acreditam que ele não vê o presente.<br><br>Mas todos os futuros possíveis.<br><br>🏛️ A Biblioteca Selada<br><br>Existe uma ala da grande biblioteca que foi fechada há décadas.<br><br>Nenhum sábio entra lá.<br><br>Nenhum registro explica o motivo.<br><br>Mas há relatos de:<br><br>sussurros vindos de dentro<br>páginas virando sozinhas<br>e sombras… que não pertencem a ninguém<br>🩸 O Ritual da Visão<br><br>Dizem que alguns escolhidos passam por um ritual secreto.<br><br>Após isso:<br><br>ganham visões<br>mas perdem algo em troca<br><br>Alguns voltam cegos.<br>Outros… voltam diferentes.<br><br>E alguns nunca voltam.<br><br>🕳️ As Ruínas Antigas<br><br>Sob Tebas existem estruturas mais antigas que a própria cidade.<br><br>Muito mais antigas.<br><br>Alguns estudiosos acreditam que:<br><br>não foram feitas por humanos<br>nem por deuses<br><br>Mas por algo que veio antes.<br><br>🌍 Importância no Mundo<br><br>Tebas é uma das forças mais perigosas… sem parecer ser.<br><br>🔮 Estratégia<br><br>Ela raramente entra em guerra.<br><br>Mas quando entra…<br><br>já sabe como vai terminar.<br><br>📚 Conhecimento<br><br>Possui informações que:<br><br>outras cidades ignoram<br>ou nem sabem que existem<br>⚖️ Equilíbrio<br><br>Enquanto Esparta representa força e Corintos riqueza…<br><br>Tebas representa controle.<br><br>💀 Verdade Oculta<br><br>Se Tebas prevê tudo…<br><br>então ela já viu o futuro do mundo.<br><br>E ainda assim… não tentou impedir.<br><br>Isso levanta uma pergunta inquietante:<br><br>Eles estão protegendo o mundo…<br>ou apenas garantindo que tudo aconteça como deveria?')"></div>

                    <div class="marker" onclick="show('🏝️ Temicera', 'imagens/loc_6.png', 'A Ilha das Guerreiras Eternas<br><br>Escondida além de nevoeiros densos e correntes traiçoeiras, Temicera não aparece em mapas comuns.<br><br>Não por acaso.<br><br>Mas por escolha.<br><br>A ilha é um santuário… e uma fortaleza.<br><br>Um lugar onde o mundo dos mortais não dita as regras.<br><br>👑 A Rainha<br><br>Temicera é governada por Hipólita, a Rainha das Amazonas.<br><br>Diferente das histórias antigas, nesta era ela não é apenas uma líder — ela é uma sobrevivente do mundo antes do Decreto Divino.<br><br>Hipólita governa com:<br><br>disciplina absoluta<br>sabedoria adquirida em séculos de guerra<br>e uma desconfiança profunda do mundo exterior<br><br>Ela acredita que o mundo dos homens está corrompido… e que Temicera é a última chama de ordem verdadeira.<br><br>⚖️ Leis de Temicera<br><br>A ilha não é apenas protegida por armas… mas por leis rígidas.<br><br>1. Nenhum homem pisa em Temicera<br>Qualquer homem que chegue à ilha:<br><br>é executado<br>ou, em casos raros, usado como moeda política<br><br>2. Força define posição<br>Hierarquia não é herdada — é conquistada:<br><br>desafios são comuns<br>derrotas são respeitadas<br>fraqueza constante não é tolerada<br><br>3. Lealdade acima de tudo<br>Traição é o maior crime.<br>A punição:<br><br>exílio… ou morte<br><br>4. O mundo exterior é proibido<br>Amazonas não podem sair livremente.<br>Apenas:<br><br>emissárias<br>ou guerreiras em missões específicas<br>🚫 Proibições<br>Uso de magia instável ou desconhecida<br>Relíquias de origem divina não autorizadas<br>Contato com impérios escravistas.<br>Qualquer tentativa de quebrar o isolamento da ilha<br>🏛️ A Ilha<br><br>Temicera é um contraste impressionante:<br><br>Florestas densas e vivas<br>Montanhas usadas como campos de treinamento<br>Praias de areia branca protegidas por falésias<br>Templos antigos dedicados a forças esquecidas<br><br>Nada ali é decadente.<br><br>Tudo é mantido com perfeição.<br><br>⚔️ As Guerreiras<br><br>As Amazonas não são apenas combatentes.<br><br>São:<br><br>estrategistas<br>caçadoras<br>artesãs de guerra<br><br>Cada uma treina desde criança.<br><br>Cada uma está pronta para lutar.<br><br>📜 Lendas de Temicera<br>🌙 A Ilha que Desaparece<br><br>Dizem que Temicera não está sempre no mesmo lugar.<br><br>Alguns acreditam que:<br><br>a ilha se move<br>ou está protegida por forças antigas<br><br>Navios que tentam encontrá-la muitas vezes:<br><br>retornam ao mesmo ponto<br>ou desaparecem completamente<br>🩸 O Sangue Antigo<br><br>Há rumores de que as Amazonas carregam um sangue diferente.<br><br>Não apenas humano.<br><br>Algo antigo.<br><br>Algo ligado às primeiras eras — talvez até anterior aos deuses atuais.<br><br>⚔️ A Última Guerra<br><br>Uma profecia circula entre as mais velhas:<br><br>“Quando o mundo esquecer o medo dos deuses… Temicera será forçada a lembrar.”<br><br>🌍 Importância no Mundo<br><br>Temicera não é apenas uma ilha isolada.<br><br>Ela é:<br><br>🛡️ Um Bastião<br><br>Um dos poucos lugares que:<br><br>não caiu sob controle imperial<br>não depende dos deuses<br>⚖️ Um Equilíbrio<br><br>Enquanto o mundo mergulha no caos sem intervenção divina, Temicera mantém:<br><br>ordem<br>tradição<br>força<br>🔥 Um Possível Conflito<br><br>O império sabe da existência da ilha.<br><br>E teme.<br><br>Porque:<br><br>não pode controlá-la<br>não pode invadi-la facilmente<br>e não entende seu poder<br>💀 Verdade Oculta<br><br>Hipólita sabe de algo que não revela.<br><br>Algo sobre o Decreto Divino.<br><br>Algo sobre o motivo de os deuses terem parado.<br><br>E talvez…<br><br>Temicera não esteja apenas se protegendo do mundo.<br><br>Mas preparando-se para quando ele finalmente quebrar.<br><br>')"></div>

                    <div class="marker" onclick="show('🏛️ Atenas', 'imagens/loc_7.png', 'A Cidade das Ideias e das Máscaras<br><br>Erguida entre colinas brancas e iluminada pelo reflexo do sol no mármore, Atenas é vista por muitos como o coração da civilização.<br><br>Mas essa visão… é apenas metade da verdade.<br><br>A cidade é viva, barulhenta, cheia de debates, arte e filosofia. Praças estão sempre ocupadas, teatros nunca ficam vazios e discursos ecoam pelas ruas.<br><br>Aqui, palavras podem construir…<br>ou destruir.<br><br>👑 O Governante de Atenas<br><br>Atenas é liderada por Leônidas Asterion, chamado de O Rei das Vozes.<br><br>Diferente de outros governantes, ele não impõe sua vontade pela força.<br><br>Ele convence.<br><br>Leônidas é:<br><br>orador incomparável<br>estrategista político<br>e mestre em manipular multidões<br><br>Dizem que ele nunca perde um debate.<br><br>E mais inquietante…<br><br>Alguns acreditam que as pessoas não concordam com ele…<br>mas são levadas a acreditar que sempre concordaram.<br><br>⚖️ Política de Atenas<br><br>Atenas se orgulha de sua forma de governo:<br><br>A voz do povo decide.<br><br>Mas nem todas as vozes têm o mesmo peso.<br><br>🏛️ A Assembleia<br><br>Cidadãos se reúnem para:<br><br>votar leis<br>decidir guerras<br>julgar crimes<br><br>Qualquer um pode falar.<br><br>Poucos realmente influenciam.<br><br>🎭 O Jogo Político<br><br>Discursos são armas.<br><br>Retórica é poder.<br><br>alianças mudam com palavras<br>decisões são moldadas por emoção<br>líderes surgem… e caem… em público<br>🕊️ A Ilusão de Liberdade<br><br>Atenas acredita ser livre.<br><br>Mas há rumores de que:<br><br>certos discursos são incentivados<br>certas ideias desaparecem rapidamente<br>e algumas verdades… nunca chegam ao público<br>🔥 Costumes de Atenas<br>🧠 Debate<br><br>Nada é aceito sem questionamento.<br><br>filosofia nas ruas<br>discussões em praças<br>ideias em constante conflito<br>🎨 Cultura<br><br>Arte é essencial.<br><br>teatro<br>escultura<br>música<br><br>Mas muitas dessas obras… escondem críticas ou mensagens políticas.<br><br>📜 Educação<br><br>Conhecimento é valorizado.<br><br>Mas não apenas aprender…<br><br>É saber argumentar.<br><br>🎭 Aparência vs Realidade<br><br>Atenas valoriza a imagem.<br><br>O que é dito em público…<br>nem sempre é o que se acredita em privado.<br><br>🐍 Lendas de Atenas<br>🗿 A Estátua que Escuta<br><br>No centro da cidade existe uma estátua antiga.<br><br>Dizem que:<br><br>ela escuta tudo<br>e que certas palavras nunca devem ser ditas perto dela<br><br>Alguns acreditam que informações chegam ao governante… através dela.<br><br>🕊️ A Voz Invisível<br><br>Há rumores de que certas ideias surgem na cidade sem origem clara.<br><br>Como se alguém:<br><br>estivesse guiando pensamentos<br>plantando opiniões<br>moldando o povo sem ser visto<br>🧠 O Debate Final<br><br>Uma lenda diz que um dia surgirá alguém capaz de vencer qualquer argumento.<br><br>E quando isso acontecer…<br><br>Atenas deixará de debater.<br><br>E começará a obedecer.<br><br>🏛️ O Templo Fechado<br><br>Um antigo templo dedicado à sabedoria permanece selado.<br><br>Ninguém entra.<br><br>Ninguém explica.<br><br>Mas há relatos de:<br><br>luzes à noite<br>vozes sussurrando respostas<br>perguntas sendo feitas… sem ninguém lá dentro<br>🌍 Importância no Mundo<br><br>Atenas é uma das maiores influências do cenário:<br><br>🧠 Ideias<br><br>Ela molda culturas.<br><br>Outras cidades copiam suas leis… mesmo sem perceber.<br><br>⚖️ Política<br><br>Decisões tomadas em Atenas afetam regiões inteiras.<br><br>🕊️ Diplomacia<br><br>Enquanto outros lutam, Atenas negocia.<br><br>E muitas vezes… vence sem guerra.<br><br>💀 Verdade Oculta<br><br>Se Atenas realmente acredita na voz do povo…<br><br>Por que tantas decisões parecem já estar encaminhadas?<br><br>Isso levanta uma suspeita perigosa:<br><br>O povo governa Atenas…<br>ou alguém governa o povo?')"></div>

                    <div class="marker" onclick="show('🏛️ Templo de Atena', 'imagens/loc_8.png', 'O Olhar da Sabedoria<br><br>No ponto mais alto da Acrópole ergue-se o Templo de Atena.<br><br>Mesmo após o Decreto Divino, quando os deuses deixaram de intervir no mundo, o templo não foi abandonado.<br><br>Pelo contrário.<br><br>Ele se tornou ainda mais importante.<br><br>Não como um lugar de fé cega…<br>Mas como um centro de disciplina, estratégia e entendimento.<br><br>🏛️ Estrutura do Templo<br><br>Construído em mármore branco que reflete a luz do sol quase como ouro, o templo domina toda a cidade.<br><br>Colunas gigantescas cercam sua entrada<br>Escadarias longas testam a determinação de quem sobe<br>Estátuas antigas observam em silêncio<br><br>No interior, o ambiente muda completamente.<br><br>Silêncio absoluto.<br>Ar frio.<br>Sensação constante de estar sendo avaliado.<br><br>No centro existe uma grande estátua de Atena.<br><br>Mas há algo estranho nela…<br><br>Os olhos parecem acompanhar quem se move.<br><br>👤 O Sacerdote<br><br>O templo é liderado por Theron Lysandros, conhecido como A Voz da Razão.<br><br>Theron não é um homem comum.<br><br>Ele não prega fé.<br><br>Ele ensina controle.<br><br>Para ele, Atena não deve ser adorada como deusa…<br><br>Mas seguida como ideal.<br><br>Características:<br>extremamente calmo<br>fala pouco, mas com precisão<br>observa antes de agir<br>raramente demonstra emoção<br><br>Dizem que ele nunca toma decisões erradas.<br><br>E isso… assusta até o próprio governante da cidade.<br><br>⚖️ Costumes do Templo<br><br>O templo não funciona como outros locais religiosos.<br><br>Aqui não há:<br><br>orações emocionais<br>pedidos por milagres<br>promessas aos deuses<br><br>Tudo é baseado em disciplina mental.<br><br>🧠 Ritual do Silêncio<br><br>Visitantes devem passar horas sem falar.<br><br>Acredita-se que:<br><br>“A mente só revela a verdade quando a voz se cala.”<br><br>⚔️ Treinamento Estratégico<br><br>Guerreiros e líderes vêm ao templo                     <div class="marker" onclick="show('☁️ Meteora', 'imagens/loc_12.png', 'A Cidade Entre o Céu e a Terra<br><br>Elevando-se sobre pilares de pedra impossíveis, Meteora não foi construída…<br><br>Ela foi desafiada.<br><br>Mosteiros, torres e fortalezas se equilibram no topo de formações rochosas gigantescas, conectadas por pontes estreitas, escadas talhadas na pedra e caminhos que parecem feitos mais para testar do que para atravessar.<br><br>Lá embaixo, o mundo continua.<br><br>Lá em cima…<br><br>o mundo observa.<br><br>Nuvens passam por entre as construções. O vento nunca para. E o silêncio — quando surge — é absoluto.<br><br>👑 O Governante de Meteora<br><br>Meteora não tem um rei tradicional.<br><br>Ela é liderada por Aion Kyrion, chamado de O Elevado.<br><br>Aion raramente desce.<br><br>Quase nunca aparece.<br><br>E quando fala… todos escutam.<br><br>Características:<br>aparência serena e distante<br>voz calma, quase sussurrada<br>decisões rápidas, sem explicação<br>comportamento quase… desapegado do mundo<br><br>Dizem que ele já passou dias — ou semanas — sem comer, sem dormir… apenas observando o horizonte.<br><br>E alguns acreditam:<br><br>Ele não governa a cidade… ele a mantém equilibrada.<br><br>⚖️ Política de Meteora<br><br>Aqui, o poder não é disputado.<br><br>Ele é… abandonado.<br><br>☁️ Hierarquia Espiritual<br><br>A posição social não depende de riqueza ou força.<br><br>Depende de:<br><br>disciplina<br>controle<br>desapego<br><br>Quanto menos alguém precisa do mundo… mais alto sobe.<br><br>Literalmente.<br><br>🕊️ Isolamento Voluntário<br><br>Meteora evita envolvimento com outras cidades.<br><br>Não por fraqueza.<br><br>Mas por escolha.<br><br>Eles acreditam que:<br><br>“Quanto mais se prende ao mundo… mais se perde de si.”<br><br>⚖️ Decisões Silenciosas<br><br>Não há debates públicos.<br><br>Não há política visível.<br><br>As decisões simplesmente… acontecem.<br><br>E ninguém questiona.<br><br>🔥 Costumes de Meteora<br>🧘 Contemplação<br><br>O principal costume é observar.<br><br>o céu<br>o vento<br>o silêncio<br><br>Porque, segundo eles:<br><br>“Tudo já está sendo dito… você só precisa aprender a escutar.”<br><br>⛰️ Ascensão<br><br>Indivíduos sobem para níveis mais altos conforme evoluem.<br><br>iniciantes ficam próximos ao solo<br>mestres vivem nos pontos mais altos<br>🔇 Voto do Silêncio<br><br>Muitos habitantes passam longos períodos sem falar.<br><br>Alguns… nunca voltam a falar.<br><br>🌬️ Desapego<br><br>Bens materiais são mínimos.<br><br>O essencial apenas.<br><br>Nada mais.<br><br>🐍 Lendas de Meteora<br>☁️ A Cidade que Flutua<br><br>Há relatos de que, em certos momentos:<br><br>as estruturas de Meteora não tocam a rocha.<br><br>Elas flutuam.<br><br>Por poucos instantes.<br><br>Mas o suficiente para deixar uma dúvida:<br><br>O que realmente sustenta a cidade?<br><br>👁️ O Homem que Subiu Demais<br><br>Uma antiga história fala de um asceta que continuou subindo…<br><br>Mesmo após o último templo.<br><br>Mesmo após a última pedra.<br><br>Ele simplesmente…<br><br>desapareceu no céu.<br><br>🌌 O Vazio que Responde<br><br>Alguns meditadores relatam algo estranho:<br><br>quando ficam tempo suficiente em silêncio absoluto…<br><br>o silêncio responde.<br><br>Não com palavras.<br><br>Mas com presença.<br><br>🕯️ O Governante que Não Desce<br><br>Dizem que Aion Kyrion não pisa no solo há anos.<br><br>E que, se ele descer…<br><br>algo muito errado terá acontecido no mundo.<br><br>🌍 Importância no Mundo<br><br>Meteora não interfere diretamente no mundo.<br><br>Mas sua existência… influencia tudo.<br><br>🧠 Sabedoria<br><br>Muitos viajam até lá buscando:<br><br>respostas<br>equilíbrio<br>propósito<br>⚖️ Neutralidade Absoluta<br><br>Nenhum império controla Meteora.<br><br>Nenhum exército a domina.<br><br>🔮 Mistério<br><br>Mesmo Tebas evita tentar entender completamente Meteora.<br><br>E isso diz muito.<br><br>💀 Verdade Oculta<br><br>Se Meteora está tão distante do mundo…<br><br>Por que parece tão… conectada a ele?<br><br>Por que aqueles que chegam lá…<br><br>começam a perceber coisas que nunca viram antes?<br><br>E por que alguns nunca querem ir embora…<br><br>mesmo podendo?')"></div>

                    <div class="marker" onclick="show('🏟️ Coliseu Olímpico', 'imagens/loc_13.png', '🏟️ Coliseu Olímpico — Onde Mortais Buscam Ser Lendas<br><br>Erguido no coração de Atenas, o Coliseu Olímpico não é apenas uma arena.<br><br>É um palco.<br><br>Um lugar onde o destino é desafiado… diante de toda a civilização.<br><br>Diferente do Coliseu do Imperador, onde escravos lutam por sobrevivência, aqui combatentes entram por escolha.<br><br>Por honra.<br>Por glória.<br>Por algo maior que eles mesmos.<br><br>Ou pelo menos… é o que acreditam.<br><br>🏛️ Estrutura do Coliseu<br><br>Construído em mármore branco e pedra polida, o Coliseu Olímpico reflete a grandiosidade de Atenas.<br><br>Arquibancadas imensas que acomodam milhares<br>Colunas ornamentadas com símbolos de vitória<br>Estátuas de campeões eternizados<br><br>A arena central é versátil e mutável:<br><br>areia dourada para combates<br>estruturas móveis para desafios táticos<br>áreas elevadas para duelos estratégicos<br><br>No topo, bandeiras longas dançam com o vento — não representando deuses…<br><br>Mas conquistas humanas.<br><br>📜 Origem — Os Primeiros Jogos<br><br>Segundo os registros mais antigos, foi neste coliseu que aconteceram os primeiros<br>Jogos Ístmicos.<br><br>Mas não eram apenas esportes.<br><br>Eram provas.<br><br>Testes criados para desafiar:<br><br>o corpo<br>a mente<br>e o espírito<br><br>Diferente dos jogos modernos, os primeiros participantes não competiam apenas entre si…<br><br>Mas contra o impossível.<br><br>👑 Administração<br><br>O Coliseu é supervisionado diretamente por representantes de Atenas, ligados ao governo de<br>Leônidas Asterion.<br><br>Mas há algo curioso:<br><br>As regras existem.<br><br>Mas sempre podem ser reinterpretadas.<br><br>⚖️ Política do Coliseu<br><br>Aqui, vitória não depende apenas de força.<br><br>Depende de:<br><br>estratégia<br>popularidade<br>narrativa<br><br>A multidão influencia.<br><br>Os juízes observam.<br><br>E Atenas aprende com cada combate.<br><br>🔥 Costumes do Coliseu<br>⚔️ Combates Honrados<br><br>Participantes entram por escolha.<br><br>Ser convidado para lutar é considerado uma honra.<br><br>🎭 Espetáculo<br><br>Lutas não são apenas batalhas.<br><br>São apresentações.<br><br>estilo importa<br>atitude importa<br>impacto importa<br>🏆 Glória Eterna<br><br>Vencedores têm seus nomes registrados.<br><br>E alguns…<br><br>transformados em estátuas dentro do coliseu.<br><br>🎉 Festival — Os Jogos Ístmicos Renovados<br><br>Realizados anualmente, esses jogos são o maior evento de Atenas.<br><br>🏟️ Provas<br>Combates individuais<br>Batalhas em grupo<br>Desafios estratégicos<br>Provações mentais<br>🏆 Recompensas<br>reconhecimento<br>influência<br>acesso ao círculo político<br><br>E às vezes…<br><br>algo mais.<br><br>🐍 Lendas do Coliseu<br>☀️ O Último Voo de Fáeton<br><br>Uma das histórias mais antigas ligadas ao coliseu fala sobre<br>Fáeton.<br><br>Dizem que ele, tentando provar seu valor, perdeu o controle de algo que jamais deveria ter tocado.<br><br>E foi destruído… pelo próprio céu.<br><br>Em Atenas, essa história não é vista como tragédia.<br><br>Mas como aviso:<br><br>“Nem toda glória pode ser suportada.”<br><br>Alguns acreditam que o coliseu foi criado exatamente para isso:<br><br>Testar limites… antes que alguém ultrapasse o que não deveria.<br><br>🏟️ A Arena que Aprende<br><br>Há relatos de que o coliseu muda conforme os combates.<br><br>Como se:<br><br>aprendesse padrões<br>se adaptasse aos lutadores<br>e criasse desafios cada vez mais difíceis<br>🩸 O Campeão Esquecido<br><br>Existe uma estátua sem nome.<br><br>Sem rosto.<br><br>Sem inscrição.<br><br>Ninguém sabe quem foi.<br><br>Mas todos evitam olhar diretamente para ela.<br><br>⚖️ O Julgamento Invisível<br><br>Alguns lutadores relatam algo estranho durante combates importantes:<br><br>Uma sensação de estar sendo julgado.<br><br>Não pela multidão.<br><br>Mas por algo… além dela.<br><br>🌍 Importância no Mundo<br><br>O Coliseu Olímpico é mais que entretenimento:<br><br>🏛️ Política<br><br>Atenas observa tudo que acontece ali.<br><br>E usa isso.<br><br>⚔️ Poder<br><br>Grandes guerreiros surgem ali.<br><br>🧠 Influência<br><br>Histórias criadas no coliseu se espalham pelo mundo.<br><br>💀 Verdade Oculta<br><br>Se o coliseu testa limites humanos…<br><br>Quem definiu esses limites?<br><br>E por que parece que alguns participantes…<br><br>chegam perto demais de algo proibido?')"></div>

                    <div class="marker" onclick="show('🏛️ Palácio de Alexandre o Grande', 'imagens/loc_14.png', 'O Trono da Conquista<br><br>Erguido no ponto mais alto da capital imperial, o palácio não foi feito apenas para governar.<br><br>Foi feito para lembrar ao mundo… quem o conquistou.<br><br>Gigantesco, imponente e visível de qualquer ponto da cidade, o palácio domina o horizonte como uma montanha de pedra e ouro. Suas muralhas são altas, suas torres afiadas e seus portões reforçados com bronze e aço.<br><br>Nada ali sugere paz.<br><br>Tudo ali fala de domínio.<br><br>🏛️ Estrutura do Palácio<br><br>O complexo é vasto, dividido em várias áreas:<br><br>⚔️ Pátio dos Generais<br><br>Um enorme espaço aberto onde:<br><br>estratégias são discutidas<br>tropas são apresentadas<br>vitórias são celebradas<br><br>Estátuas de comandantes cercam o local, eternizando campanhas militares.<br><br>👑 Salão do Trono<br><br>O coração do palácio.<br><br>Um salão gigantesco, sustentado por colunas esculpidas com cenas de guerra.<br><br>No centro, elevado por vários degraus, está o trono de<br>Alexandre o Grande.<br><br>Atrás dele, um enorme mapa do mundo conhecido — com territórios marcados como já conquistados… ou prestes a ser.<br><br>🕯️ Ala Real<br><br>Onde a família imperial residia.<br><br>Luxuosa, protegida e silenciosa.<br><br>Mas hoje…<br><br>carrega um vazio impossível de ignorar.<br><br>⚰️ Câmara da Herdeira<br><br>Um local que não deveria existir… mas existe.<br><br>Uma sala preservada exatamente como era.<br><br>Pertencia à filha do imperador.<br><br>E nunca mais foi tocada.<br><br>👑 O Imperador<br><br>Alexandre o Grande não é apenas um governante.<br><br>Ele é uma força.<br><br>Conquistador de toda a Grécia, estrategista incomparável e líder absoluto, Alexandre unificou territórios que antes eram inimigos mortais.<br><br>Mas há algo que nenhuma guerra preparou ele para enfrentar.<br><br>A perda.<br><br>🩸 A Tragédia<br><br>Sua filha — herdeira do império — foi sequestrada e levada para território persa por<br>Xerxes I.<br><br>O objetivo nunca foi claro:<br><br>chantagem?<br>provocação?<br>guerra?<br><br>Mas o resultado foi inevitável.<br><br>Ela foi assassinada.<br><br>E seu corpo… devolvido.<br><br>🔥 Consequências<br><br>Desde então, o palácio mudou.<br><br>E o imperador também.<br><br>⚔️ O Fim da Diplomacia<br><br>Negociações cessaram.<br><br>A guerra deixou de ser opção.<br><br>Se tornou destino.<br><br>🩸 O Salão Silencioso<br><br>Festas e celebrações acabaram.<br><br>O palácio ecoa mais vazio.<br><br>Mais frio.<br><br>⚰️ O Luto Permanente<br><br>A câmara da herdeira permanece intacta.<br><br>Guardada.<br><br>Vigiada.<br><br>Ninguém entra sem permissão direta.<br><br>🐍 Lendas do Palácio<br>👁️ A Presença na Câmara<br><br>Guardas relatam que, durante a noite:<br><br>há movimento na ala da herdeira.<br><br>Sons leves.<br>Passos suaves.<br><br>Como se alguém ainda estivesse lá.<br><br>⚔️ O Imperador Que Nunca Dorme<br><br>Dizem que Alexandre não dorme mais.<br><br>Que passa noites inteiras:<br><br>estudando mapas<br>planejando guerras<br>olhando na direção do leste<br>🩸 O Sangue que Clama<br><br>Alguns acreditam que a morte da filha não foi comum.<br><br>Que algo mais esteve envolvido.<br><br>Algo antigo.<br><br>Algo que agora…<br><br>observa o imperador.<br><br>🌍 Importância no Mundo<br><br>O palácio é o centro do maior poder militar existente:<br><br>⚔️ Guerra<br><br>Decisões que começam ali… mudam o mundo.<br><br>👑 Autoridade<br><br>Nenhum outro líder possui tanto controle direto.<br><br>🩸 Conflito<br><br>A guerra entre Grécia e Pérsia não é mais política.<br><br>É pessoal.<br><br>💀 Verdade Oculta<br><br>Se o sequestro foi um ato de guerra…<br><br>Por que o corpo foi devolvido?<br><br>Por que não houve exigências claras?<br><br>E por que alguns acreditam que a morte da herdeira…<br><br>foi apenas o começo de algo maior?')"></div>

                <div class="marker-wrapper" style="left:14.453125%; top:26.46484375%">
                    <div class="marker-label">⚔️ Templo de Ares</div>
                    <div class="marker" onclick="show('⚔️ Templo de Ares', 'imagens/loc_15.png', 'O Santuário da Guerra Viva<br><br>Erguido em uma região marcada por batalhas antigas, o templo de Ares não é um lugar de contemplação.<br><br>É um campo de prova.<br><br>Pedras manchadas, colunas quebradas e marcas de lâminas fazem parte da estrutura. O templo parece mais uma fortaleza em ruínas constantes… que nunca é totalmente reconstruída.<br><br>Porque, para Ares:<br><br>A guerra nunca termina.<br><br>🏛️ Estrutura do Templo<br><br>O templo é aberto, brutal e funcional.<br><br>Arena central usada para combates reais<br>Altares feitos de pedra escura marcada por sangue seco<br>Correntes, armas e armaduras espalhadas como oferendas<br><br>No centro existe um círculo de pedra rachada.<br><br>Ali não há estátua perfeita.<br><br>Há uma figura de Ares danificada… como se estivesse sempre em batalha.<br><br>E logo abaixo desse círculo…<br><br>existe uma abertura.<br><br>Um acesso subterrâneo.<br><br>🔮 O “Oráculo” de Ares<br><br>Diferente do verdadeiro<br>Oráculo de Delfos,<br>o templo de Ares possui uma versão corrompida.<br><br>Aqui, o futuro não é revelado com palavras claras.<br><br>Ele é arrancado através da violência.<br><br>⚔️ Como funciona<br><br>Aqueles que buscam respostas:<br><br>entram na arena<br>enfrentam um oponente (ou algo pior)<br>lutam até o limite<br><br>Durante o combate…<br><br>visões surgem.<br><br>Fragmentadas. Caóticas. Intensamente reais.<br><br>⚠️ Regra do Oráculo de Ares:<br><br>“Você não escuta o destino…<br>você sobrevive a ele.”<br><br>👤 O Sacerdote<br><br>O templo é liderado por Drakar Vhal, conhecido como A Voz da Guerra.<br><br>Drakar não é apenas um sacerdote.<br><br>Ele é um guerreiro.<br><br>E já provou isso… inúmeras vezes.<br><br>Características:<br>corpo marcado por cicatrizes profundas<br>olhar agressivo e constante<br>fala direta, sem rodeios<br>acredita que dor revela verdade<br><br>Dizem que ele já morreu em combate ritual…<br><br>e voltou.<br><br>⚖️ Costumes do Templo<br>⚔️ Combate Ritual<br><br>Toda decisão importante é resolvida em luta.<br><br>disputas<br>julgamentos<br>provas<br><br>Tudo termina em combate.<br><br>🩸 Oferendas de Sangue<br><br>Sacrifícios não são simbólicos.<br><br>São reais.<br><br>Mas não necessariamente fatais.<br><br>Dor é o que importa.<br><br>🔥 Provação da Resistência<br><br>Fiéis passam por:<br><br>fome<br>exaustão<br>dor física<br><br>Porque, segundo eles:<br><br>“Só o quebrado revela quem realmente é.”<br><br>🎉 Festival de Ares — O Dia da Carnificina<br><br>O evento mais brutal do seu mundo.<br><br>⚔️ Etapas<br><br>1. Chamado dos Fortes<br>Guerreiros de todo o mundo são convidados.<br><br>2. Arena Aberta<br>Combates livres, sem restrições formais.<br><br>3. A Provação Final<br>Os sobreviventes enfrentam desafios cada vez mais impossíveis.<br><br>🏆 Resultado<br><br>Não há “campeão” tradicional.<br><br>Há sobreviventes.<br><br>E aqueles que sobrevivem…<br><br>não são mais os mesmos.<br><br>🐍 Lendas do Templo<br>🩸 O Oráculo que Sangra<br><br>Dizem que o “oráculo” de Ares não é um lugar…<br><br>Mas uma entidade.<br><br>Algo que se alimenta de conflito.<br><br>E responde apenas quando há dor suficiente.<br><br>⚔️ O Sacerdote Invencível<br><br>Há rumores de que<br>Drakar Vhal<br>nunca perdeu uma luta justa.<br><br>E que ele evita lutar…<br><br>porque sabe o que acontece quando luta sério.<br><br>👁️ A Visão Final<br><br>Alguns guerreiros relatam que, no auge da batalha, veem algo:<br><br>Um campo de guerra infinito.<br><br>E uma presença observando tudo.<br><br>🕳️ O Subterrâneo<br><br>Abaixo do templo existem túneis antigos.<br><br>Muito antigos.<br><br>E dizem que:<br><br>não foram feitos por humanos<br>nem por deuses<br><br>Mas por algo que conhecia a guerra… antes dela existir.<br><br>🌍 Importância no Mundo<br><br>O templo de Ares representa o extremo oposto de Atenas:<br><br>⚔️ Força<br><br>Aqui, poder é direto.<br><br>Sem política. Sem manipulação.<br><br>🩸 Verdade Brutal<br><br>Nada é escondido.<br><br>Tudo é testado.<br><br>🔥 Influência<br><br>Mercenários, guerreiros e até generais passam por lá.<br><br>💀 Verdade Oculta<br><br>Se o destino pode ser visto no combate…<br><br>Isso significa que:<br><br>a guerra revela o futuro<br>ou<br>o futuro é inevitavelmente… guerra?')"></div>
                </div>
                <div class="marker-wrapper" style="left:19.3359375%; top:18.65234375%">
                    <div class="marker-label">⚔️ Exército Imperial</div>
                    <div class="marker" onclick="show('⚔️ Exército Imperial', 'imagens/loc_15.png', 'A Mão que Molda o Mundo<br><br>O Exército do império de Alexandre o Grande não é apenas uma força militar.<br><br>É uma máquina de conquista.<br><br>Forjado em campanhas intermináveis, batalhas brutais e estratégias impecáveis, o exército imperial unificou a Grécia sob um único estandarte — não pela diplomacia…<br><br>Mas pela inevitabilidade.<br><br>Onde ele marcha, reinos caem.<br>Onde ele chega, resistência quebra.<br><br>E onde ele permanece…<br><br>o mundo muda.<br><br>🏛️ Estrutura do Exército<br><br>O exército é dividido em múltiplas camadas, cada uma com função precisa:<br><br>🛡️ Infantaria de Linha<br><br>A base do poder imperial.<br><br>disciplinados<br>organizados em formações rígidas<br>especialistas em combate coletivo<br><br>Eles não lutam como indivíduos.<br><br>Eles lutam como um só corpo.<br><br>🐎 Cavalaria de Choque<br><br>A força de impacto.<br><br>veloz<br>brutal<br>decisiva<br><br>Responsável por quebrar formações inimigas e finalizar combates.<br><br>🏹 Arqueiros e Suporte<br><br>Controle do campo de batalha.<br><br>ataques à distância<br>cobertura estratégica<br>enfraquecimento do inimigo antes do confronto direto<br>🧠 Comando Estratégico<br><br>Generais treinados diretamente sob doutrinas imperiais.<br><br>Nenhuma batalha é iniciada sem cálculo.<br><br>Nenhuma vitória é acidental.<br><br>👑 O Alto Comando<br><br>Acima de todos, o próprio imperador.<br><br>Mas logo abaixo dele…<br><br>está um homem.<br><br>Um nome que ecoa nos campos de batalha.<br><br>⚔️ A Tropa Dourada<br><br>A elite absoluta.<br><br>A lâmina final do império.<br><br>🛡️ Quem são<br><br>Conhecidos como<br>Tropa Dourada,<br>esses soldados não são apenas guerreiros.<br><br>São símbolos vivos de poder.<br><br>Escolhidos a dedo, treinados até o limite e testados em combates reais, apenas os melhores entre os melhores têm o direito de vestir a armadura dourada.<br><br>✨ Aparência<br><
