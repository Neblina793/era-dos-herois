<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Era dos Heróis - Biblioteca de HQs</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            margin: 0;
            padding-top: 80px; /* Espaço para o menu fixo */
        }

        /* Menu de Navegação Fixo */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            padding: 15px 0;
            text-align: center;
            border-bottom: 2px solid var(--primary-gold);
            z-index: 1000;
        }

        .btn-home {
            text-decoration: none;
            color: var(--primary-gold);
            border: 1px solid var(--primary-gold);
            padding: 10px 25px;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-home:hover {
            background-color: var(--primary-gold);
            color: black;
        }

        /* Layout Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Acordeão (Menus Expansíveis) */
        .edition-section {
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        .edition-header {
            background-color: var(--card-bg);
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-gold);
            transition: background 0.3s;
        }

        .edition-header:hover {
            background-color: #252525;
        }

        .edition-content {
            display: none;
            padding: 20px;
            background-color: #1a1a1a;
            text-align: center;
        }

        /* Estilo das Capas */
        .hq-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }

        .hq-item {
            max-width: 280px;
            transition: transform 0.3s;
        }

        .hq-item:hover {
            transform: scale(1.05);
        }

        .hq-item img {
            width: 100%;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border: 1px solid #444;
        }

        .hq-title {
            margin-top: 10px;
            display: block;
            font-size: 0.9rem;
        }

        .coming-soon {
            font-style: italic;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="btn-home">VOLTAR PARA INÍCIO</a>
    </nav>

    <div class="container">
        <h1>Galeria de HQs</h1>

        <div class="edition-section">
            <div class="edition-header" onclick="toggleSection('zero')">
                EDIÇÃO ZERO <span>+</span>
            </div>
            <div id="zero" class="edition-content">
                <div class="hq-grid">
                    <div class="hq-item">
                        <a href="https://drive.google.com/drive/folders/1KSpYQLQy8EYa7RUTytQe_FJy9x4vYQhA?hl=pt-br" target="_blank">
                            <img src="capa001.png" alt="HQ Edição 001 - Capa">
                            <span class="hq-title">Visualizar Parte 1</span>
                        </a>
                    </div>
                    <div class="hq-item">
                        <a href="https://drive.google.com/drive/folders/1KSpYQLQy8EYa7RUTytQe_FJy9x4vYQhA?hl=pt-br">
                            <img src="capa003.png" alt="HQ Edição 002 - Capa">
                            <span class="hq-title">Visualizar Parte 2</span>
                        </a>
                    </div>
                    <div class="hq-item">
                        <a href="https://drive.google.com/drive/folders/1KSpYQLQy8EYa7RUTytQe_FJy9x4vYQhA?hl=pt-br">
                            <img src="capa002.png" alt="HQ Edição 003 - Capa">
                            <span class="hq-title">Visualizar Parte 3</span>
                        </a>
                    </div>
                    <div class="hq-item">
                        <a href="https://drive.google.com/drive/folders/1KSpYQLQy8EYa7RUTytQe_FJy9x4vYQhA?hl=pt-br">
                            <img src="capa004.png" alt="HQ Edição 004 - Capa">
                            <span class="hq-title">Visualizar Parte 3</span>
                        </a>
                    </div>
                    <div class="hq-item">
                        <a href="https://drive.google.com/drive/folders/1KSpYQLQy8EYa7RUTytQe_FJy9x4vYQhA?hl=pt-br">
                            <img src="capa005.png" alt="HQ Edição 005 - Capa">
                            <span class="hq-title">Visualizar Parte 3</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="edition-section">
            <div class="edition-header" onclick="toggleSection('ed001')">
                EDIÇÃO 001 <span>+</span>
            </div>
            <div id="ed001" class="edition-content">
                <p class="coming-soon">Em breve...</p>
            </div>
        </div>

    </div>

    <script>
        function toggleSection(id) {
            const section = document.getElementById(id);
            const isVisible = section.style.display === "block";
            
            // Fecha todas antes de abrir a nova (opcional)
            document.querySelectorAll('.edition-content').forEach(el => el.style.display = 'none');
            
            // Abre ou fecha a clicada
            section.style.display = isVisible ? "none" : "block";
        }
    </script>

</body>
</html>
