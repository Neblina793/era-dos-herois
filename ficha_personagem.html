<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto G | Gerenciador de Fichas Completo</title>
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-bg: #0a0a0b;
            --card-bg: #161618;
            --text-light: #e0e0e0;
            --accent-red: #ff4655;
        }

        body {
    font-family: 'Inter', sans-serif;
    background-color: #070709;
    background-image: url('001.png'); /* Mesma imagem da index */
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    position: relative;
    color: #e2e8f0;

body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(7, 7, 9, 0.9); 
    z-index: -1; /* Fica atrás do conteúdo */
}


        h1, h3, h4, .btn-expande { font-family: 'Cinzel', serif; }
        h1 { color: var(--primary-gold); text-transform: uppercase; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); margin-top: 20px; }

        /* NAVEGAÇÃO */
        .nav-top { width: 100%; max-width: 550px; display: flex; justify-content: space-between; margin-bottom: 20px; }
        .btn-nav { background: none; border: 1px solid var(--primary-gold); color: var(--primary-gold); padding: 8px 15px; border-radius: 4px; cursor: pointer; transition: 0.3s; text-decoration: none; font-size: 14px; font-weight: bold; }
        .btn-nav:hover { background: var(--primary-gold); color: #000; }

        .container { width: 100%; max-width: 550px; display: flex; flex-direction: column; gap: 12px; }
        
        .btn-expande { background-color: var(--card-bg); color: #f0f0f0; padding: 16px; border: 1px solid rgba(212, 175, 55, 0.4); text-align: left; width: 100%; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.3s; outline: none; }
        .btn-expande:hover { border-color: var(--primary-gold); box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
        
        .conteudo { display: none; background-color: #111113; padding: 20px; border: 1px solid #333; border-top: none; border-radius: 0 0 8px 8px; margin-top: -12px; }

        /* FORMULÁRIO */
        .grid-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        label { font-size: 11px; color: var(--primary-gold); font-weight: bold; text-transform: uppercase; }
        input, textarea { padding: 10px; background: #000; border: 1px solid #333; color: white; border-radius: 4px; outline: none; width: 100%; box-sizing: border-box; }
        input:focus, textarea:focus { border-color: var(--primary-gold); }

        /* LISTAS E CARDS */
        .card-item { background: var(--card-bg); border-left: 4px solid var(--primary-gold); padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
        .actions-btns button { background: none; border: none; font-size: 18px; cursor: pointer; margin-left: 8px; }

        /* MODAIS */
        #modal-ficha, [id^="modal-seletor"] { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; overflow-y: auto; padding: 10px; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--primary-gold); max-width: 500px; margin: 40px auto; padding: 25px; border-radius: 12px; }
        
        /* FICHA TÉCNICA (BRANCA PARA IMPRESSÃO/LEITURA) */
        .dnd-sheet { background: #fff; color: #000; max-width: 700px; margin: auto; padding: 25px; border-radius: 5px; }
        .dnd-header { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; display: grid; grid-template-columns: 100px 1fr 1fr; gap: 15px; align-items: center; }
        .char-img-ficha { width: 80px; height: 80px; border: 2px solid #000; border-radius: 4px; object-fit: cover; background: #eee; }
        .dnd-attr-box { border: 1px solid #000; border-radius: 10px; text-align: center; padding: 5px; background: #f9f9f9; }
        .dnd-attr-mod { border: 1px solid #000; border-radius: 50%; width: 28px; height: 28px; margin: 4px auto; display: flex; align-items: center; justify-content: center; font-weight: bold; background: #fff; }
        
        .btn-salvar { background: var(--primary-gold); color: black; border: none; padding: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 10px; transition: 0.3s; }
        .btn-salvar:hover { background: #fff; transform: scale(1.02); }
        .btn-fechar { background: #333; color: white; border: none; padding: 10px; border-radius: 4px; width: 100%; cursor: pointer; margin-top: 20px; font-weight: bold; }
        .item-in-sheet { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dotted #888; padding: 5px 0; font-size: 13px; }
        .item-remove { color: var(--accent-red); cursor: pointer; font-weight: bold; padding: 0 5px; }
    </style>
</head>
<body>

    <div class="nav-top">
    <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-xl">
    <div class="font-cinzel text-yellow-500 uppercase">
        <a href="index.html" class="btn-nav"><i class="fa fa-home"></i> INÍCIO</a>
        

</div>

    <h1>Forja de Heróis</h1>

    <div class="container">
        <button class="btn-expande" onclick="toggle('criar-ficha')">✚ CRIAR / EDITAR PERSONAGEM</button>
        <div id="criar-ficha" class="conteudo">
            <input type="hidden" id="edit-index" value="-1">
            <input type="hidden" id="char-img-base64" value="">
            <div class="form-group"><label>Imagem</label><input type="file" id="char-img-input" accept="image/*" onchange="converterImagem()"></div>
            <div class="grid-campos">
                <div class="form-group" style="grid-column: span 2;"><label>Nome</label><input type="text" id="char-nome"></div>
                <div class="form-group"><label>Classe</label><input type="text" id="char-classe"></div>
            </div>
            <div class="grid-campos">
                <div class="form-group"><label>Nível</label><input type="number" id="char-nivel" value="1"></div>
                <div class="form-group"><label>PV Máx</label><input type="number" id="char-pv"></div>
                <div class="form-group"><label>CA</label><input type="number" id="char-ca"></div>
            </div>
            <div class="form-group"><label>Inventário</label><textarea id="char-inventario" rows="2"></textarea></div>
            <label>Atributos</label>
            <div class="grid-campos">
                <div class="form-group"><label>FOR</label><input type="number" id="for" value="10"></div>
                <div class="form-group"><label>DES</label><input type="number" id="des" value="10"></div>
                <div class="form-group"><label>CON</label><input type="number" id="con" value="10"></div>
                <div class="form-group"><label>INT</label><input type="number" id="int" value="10"></div>
                <div class="form-group"><label>SAB</label><input type="number" id="sab" value="10"></div>
                <div class="form-group"><label>CAR</label><input type="number" id="car" value="10"></div>
            </div>
            <button class="btn-salvar" onclick="salvarPersonagem()">💾 Salvar Personagem</button>
        </div>

        <button class="btn-expande" onclick="toggle('criar-magia')">✚ CRIAR NOVA MAGIA</button>
        <div id="criar-magia" class="conteudo">
            <div class="form-group"><label>Nome</label><input type="text" id="mag-nome"></div>
            <div class="form-group"><label>Descrição</label><textarea id="mag-desc" rows="2"></textarea></div>
            <button class="btn-salvar" onclick="salvarMagia()">💾 Salvar no Grimório</button>
        </div>

        <button class="btn-expande" onclick="toggle('criar-talento')">✚ CRIAR NOVO TALENTO</button>
        <div id="criar-talento" class="conteudo">
            <div class="form-group"><label>Nome</label><input type="text" id="tal-nome"></div>
            <div class="form-group"><label>Descrição</label><textarea id="tal-desc" rows="2"></textarea></div>
            <button class="btn-salvar" onclick="salvarTalento()">💾 Salvar Talentos</button>
        </div>

        <button class="btn-expande" onclick="toggle('criar-habilidade')">✚ CRIAR NOVA HABILIDADE</button>
        <div id="criar-habilidade" class="conteudo">
            <div class="form-group"><label>Nome</label><input type="text" id="hab-nome"></div>
            <div class="form-group"><label>Descrição</label><textarea id="hab-desc" rows="2"></textarea></div>
            <button class="btn-salvar" onclick="salvarHabilidade()">💾 Salvar Habilidades</button>
        </div>

        <hr style="border: 0.5px solid var(--primary-gold); opacity: 0.2; margin: 10px 0;">

        <button class="btn-expande" onclick="toggle('lista-pers')">📋 MEUS PERSONAGENS</button>
        <div id="lista-pers" class="conteudo"><div id="container-lista-pers"></div></div>

        <button class="btn-expande" onclick="toggle('lista-magias')">📖 GRIMÓRIO (MAGIAS)</button>
        <div id="lista-magias" class="conteudo"><div id="container-lista-magias"></div></div>

        <button class="btn-expande" onclick="toggle('lista-talentos')">📜 TALENTOS</button>
        <div id="lista-talentos" class="conteudo"><div id="container-lista-talentos"></div></div>

        <button class="btn-expande" onclick="toggle('lista-habilidades')">⚔️ HABILIDADES</button>
        <div id="lista-habilidades" class="conteudo"><div id="container-lista-habilidades"></div></div>
    </div>

    <div id="modal-seletor"><div class="modal-content"><h3>Vincular Magia a:</h3><div id="lista-opcoes-pers"></div><button class="btn-fechar" onclick="fecharModal('modal-seletor')">FECHAR</button></div></div>
    <div id="modal-seletor-talento"><div class="modal-content"><h3>Vincular Talento a:</h3><div id="lista-opcoes-pers-talento"></div><button class="btn-fechar" onclick="fecharModal('modal-seletor-talento')">FECHAR</button></div></div>
    <div id="modal-seletor-habilidade"><div class="modal-content"><h3>Vincular Habilidade a:</h3><div id="lista-opcoes-pers-habilidade"></div><button class="btn-fechar" onclick="fecharModal('modal-seletor-habilidade')">FECHAR</button></div></div>

    <div id="modal-ficha"><div class="dnd-sheet">
        <button class="btn-nav" id="btn-edit-na-ficha" style="color:black; margin-bottom:10px">✎ EDITAR</button>
        <div id="conteudo-ficha-detalhada"></div>
        <button class="btn-fechar" style="background:#000" onclick="fecharModal('modal-ficha')">FECHAR</button>
    </div></div>

    <script>
        // RECUPERAÇÃO DE DADOS
        let personagens = JSON.parse(localStorage.getItem('rpg_v6_total')) || [];
        let magias = JSON.parse(localStorage.getItem('rpg_v6_mags')) || [];
        let talentos = JSON.parse(localStorage.getItem('rpg_v6_talentos')) || [];
        let habilidades = JSON.parse(localStorage.getItem('rpg_v6_habs')) || [];

        function toggle(id) {
            const status = document.getElementById(id).style.display;
            document.querySelectorAll('.conteudo').forEach(d => d.style.display = 'none');
            document.getElementById(id).style.display = (status === "block" ? "none" : "block");
        }

        function fecharModal(id) { document.getElementById(id).style.display = 'none'; }
        function getMod(val) { let m = Math.floor((val - 10) / 2); return (m >= 0 ? "+" : "") + m; }

        function converterImagem() {
            const file = document.getElementById('char-img-input').files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 200; canvas.height = 200;
                    ctx.drawImage(img, 0, 0, 200, 200);
                    document.getElementById('char-img-base64').value = canvas.toDataURL('image/jpeg', 0.7);
                }
            };
            if(file) reader.readAsDataURL(file);
        }

        function salvarPersonagem() {
            const idx = parseInt(document.getElementById('edit-index').value);
            const p = {
                nome: document.getElementById('char-nome').value || "Sem Nome",
                classe: document.getElementById('char-classe').value || "Aventureiro",
                nivel: document.getElementById('char-nivel').value || 1,
                pv: document.getElementById('char-pv').value || 10,
                ca: document.getElementById('char-ca').value || 10,
                inventario: document.getElementById('char-inventario').value || "",
                imagem: document.getElementById('char-img-base64').value,
                for: document.getElementById('for').value, des: document.getElementById('des').value,
                con: document.getElementById('con').value, int: document.getElementById('int').value,
                sab: document.getElementById('sab').value, car: document.getElementById('car').value,
                grimorio: (idx !== -1) ? (personagens[idx].grimorio || []) : [],
                talentos: (idx !== -1) ? (personagens[idx].talentos || []) : [],
                habilidades: (idx !== -1) ? (personagens[idx].habilidades || []) : []
            };
            if (idx === -1) personagens.push(p); else personagens[idx] = p;
            localStorage.setItem('rpg_v6_total', JSON.stringify(personagens));
            location.reload();
        }

        // MAGIAS, TALENTOS E HABILIDADES
        function salvarMagia() { magias.push({nome: document.getElementById('mag-nome').value, desc: document.getElementById('mag-desc').value}); localStorage.setItem('rpg_v6_mags', JSON.stringify(magias)); renderListaMagias(); }
        function salvarTalento() { talentos.push({nome: document.getElementById('tal-nome').value, desc: document.getElementById('tal-desc').value}); localStorage.setItem('rpg_v6_talentos', JSON.stringify(talentos)); renderListaTalentos(); }
        function salvarHabilidade() { habilidades.push({nome: document.getElementById('hab-nome').value, desc: document.getElementById('hab-desc').value}); localStorage.setItem('rpg_v6_habs', JSON.stringify(habilidades)); renderListaHabilidades(); }

        // RENDERS E VINCULOS (MAGIA/TALENTO/HAB)
        function renderListaMagias() { document.getElementById('container-lista-magias').innerHTML = magias.map((m, i) => `<div class="card-item"><span>${m.nome}</span><button onclick="abrirSeletor(${i}, 'magia')" style="color:var(--primary-gold)">✚</button></div>`).join(""); }
        function renderListaTalentos() { document.getElementById('container-lista-talentos').innerHTML = talentos.map((t, i) => `<div class="card-item"><span>${t.nome}</span><button onclick="abrirSeletor(${i}, 'talento')" style="color:var(--primary-gold)">✚</button></div>`).join(""); }
        function renderListaHabilidades() { document.getElementById('container-lista-habilidades').innerHTML = habilidades.map((h, i) => `<div class="card-item"><span>${h.nome}</span><button onclick="abrirSeletor(${i}, 'habilidade')" style="color:var(--primary-gold)">✚</button></div>`).join(""); }

        function abrirSeletor(idx, tipo) {
            let mId = tipo === 'magia' ? 'modal-seletor' : (tipo === 'talento' ? 'modal-seletor-talento' : 'modal-seletor-habilidade');
            let listId = tipo === 'magia' ? 'lista-opcoes-pers' : (tipo === 'talento' ? 'lista-opcoes-pers-talento' : 'lista-opcoes-pers-habilidade');
            document.getElementById(listId).innerHTML = personagens.map((p, pIdx) => `<button class="btn-salvar" onclick="vincular(${idx}, ${pIdx}, '${tipo}')">${p.nome}</button>`).join("");
            document.getElementById(mId).style.display = 'block';
        }

        function vincular(itemIdx, pIdx, tipo) {
            let key = tipo === 'magia' ? 'grimorio' : (tipo === 'talento' ? 'talentos' : 'habilidades');
            let source = tipo === 'magia' ? magias : (tipo === 'talento' ? talentos : habilidades);
            personagens[pIdx][key].push(source[itemIdx]);
            localStorage.setItem('rpg_v6_total', JSON.stringify(personagens));
            alert("Vinculado com sucesso!");
            fecharModal('modal-seletor'); fecharModal('modal-seletor-talento'); fecharModal('modal-seletor-habilidade');
        }

        function abrirFicha(i) {
            const p = personagens[i];
            document.getElementById('btn-edit-na-ficha').onclick = () => editarPers(i);
            document.getElementById('conteudo-ficha-detalhada').innerHTML = `
                <div class="dnd-header">
                    <img src="${p.imagem || ''}" class="char-img-ficha">
                    <div><small>NOME</small><br><b>${p.nome}</b></div>
                    <div style="text-align:right"><small>${p.classe.toUpperCase()}</small><br><b>NV ${p.nivel}</b></div>
                </div>
                <div style="display:flex; gap:15px;">
                    <div style="width:100px">${['FOR', 'DES', 'CON', 'INT', 'SAB', 'CAR'].map(a => `<div class="dnd-attr-box"><label>${a}</label><div class="dnd-attr-mod">${getMod(p[a.toLowerCase()])}</div><small>${p[a.toLowerCase()]}</small></div>`).join("")}</div>
                    <div style="flex:1">
                        <div style="display:grid; grid-template-columns: 1fr 1fr; border:1px solid #000; padding:10px; text-align:center; margin-bottom:10px;">
                            <div><small>CA</small><br><b>${p.ca}</b></div>
                            <div><small>PV</small><br><b>${p.pv}</b></div>
                        </div>
                        <h4 style="border-bottom:1px solid #000; margin:5px 0">HABILIDADES / TALENTOS</h4>
                        ${(p.habilidades || []).map((h, hi) => `<div class="item-in-sheet"><span onclick="alert('${h.desc}')">⚔️ ${h.nome}</span><span class="item-remove" onclick="removerItem(${i}, ${hi}, 'habilidades')">✖</span></div>`).join("")}
                        ${(p.talentos || []).map((t, ti) => `<div class="item-in-sheet"><span onclick="alert('${t.desc}')">📜 ${t.nome}</span><span class="item-remove" onclick="removerItem(${i}, ${ti}, 'talentos')">✖</span></div>`).join("")}
                        <h4 style="border-bottom:1px solid #000; margin:5px 0; margin-top:10px;">GRIMÓRIO</h4>
                        ${(p.grimorio || []).map((m, mi) => `<div class="item-in-sheet"><span onclick="alert('${m.desc}')">✨ ${m.nome}</span><span class="item-remove" onclick="removerItem(${i}, ${mi}, 'grimorio')">✖</span></div>`).join("")}
                    </div>
                </div>
            `;
            document.getElementById('modal-ficha').style.display = 'block';
        }

        function removerItem(pIdx, itemIdx, key) { if(confirm("Remover?")) { personagens[pIdx][key].splice(itemIdx, 1); localStorage.setItem('rpg_v6_total', JSON.stringify(personagens)); abrirFicha(pIdx); } }
        function excluirPers(i) { if(confirm("Excluir personagem?")) { personagens.splice(i, 1); localStorage.setItem('rpg_v6_total', JSON.stringify(personagens)); renderListaPers(); } }

        function renderListaPers() {
            document.getElementById('container-lista-pers').innerHTML = personagens.map((p, i) => `
                <div class="card-item">
                    <div onclick="abrirFicha(${i})" style="cursor:pointer"><b>${p.nome}</b><br><small>${p.classe} - Nv ${p.nivel}</small></div>
                    <div class="actions-btns"><button onclick="excluirPers(${i})" style="color:var(--accent-red)">✖</button></div>
                </div>
            `).join("");
        }

        function editarPers(i) {
            const p = personagens[i]; document.getElementById('edit-index').value = i;
            document.getElementById('char-nome').value = p.nome; document.getElementById('char-classe').value = p.classe;
            document.getElementById('char-nivel').value = p.nivel; document.getElementById('char-pv').value = p.pv;
            document.getElementById('char-ca').value = p.ca; document.getElementById('for').value = p.for;
            document.getElementById('des').value = p.des; document.getElementById('con').value = p.con;
            document.getElementById('int').value = p.int; document.getElementById('sab').value = p.sab;
            document.getElementById('car').value = p.car; document.getElementById('char-inventario').value = p.inventario;
            fecharModal('modal-ficha'); toggle('criar-ficha');
        }

        // Inicialização
        renderListaPers(); renderListaMagias(); renderListaTalentos(); renderListaHabilidades();
    </script>
</body>
</html>
