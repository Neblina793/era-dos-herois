<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forja de Heróis | Vandim VTT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark: #070709; --card: #161618; }
        body { 
            font-family: 'Inter', sans-serif; background-color: var(--dark); color: #e2e8f0;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0;
            background-image: url('001.png'); background-size: cover; background-attachment: fixed;
        }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 7, 9, 0.9); z-index: -1; }
        .container { width: 100%; max-width: 700px; padding: 20px; }
        h1 { font-family: 'Cinzel', serif; color: var(--gold); text-align: center; font-size: 2.5rem; margin-bottom: 20px; }
        .btn-expande { background: var(--card); color: #fff; padding: 15px; border: 1px solid rgba(212, 175, 55, 0.3); width: 100%; text-align: left; cursor: pointer; border-radius: 8px; margin-bottom: 8px; font-family: 'Cinzel', serif; }
        .conteudo { display: none; background: #111113; padding: 20px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        input, textarea, select { padding: 10px; background: #000; border: 1px solid #333; color: #fff; width: 100%; margin-bottom: 10px; border-radius: 4px; }
        label { font-size: 11px; color: var(--gold); font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .pericia-linha { display: flex; justify-content: space-between; align-items: center; padding: 5px; border-bottom: 1px solid #222; }
        .item-card { background: var(--card); padding: 10px; margin-bottom: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid var(--gold); }
        #modal-ficha { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; overflow-y: auto; padding: 20px; }
        .dnd-sheet { background: white; color: black; max-width: 600px; margin: auto; padding: 25px; border-radius: 5px; }
        .ficha-categoria-titulo { font-family: 'Cinzel', serif; border-bottom: 2px solid #000; margin-top: 15px; font-weight: bold; color: #000; text-transform: uppercase; font-size: 0.9rem; }
        .ficha-item-linha { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 5px 0; }
        .nome-clicavel { cursor: pointer; font-weight: 600; color: #b91c1c; flex-grow: 1; }
        .desc-expandida { display: none; font-size: 0.85rem; background: #f9f9f9; padding: 10px; border-radius: 4px; margin-top: 5px; border-left: 2px solid #ccc; color: #333; }
        .img-preview { width: 100px; height: 100px; object-fit: cover; border: 2px solid var(--gold); border-radius: 8px; margin-bottom: 10px; }
        .sheet-img { width: 120px; height: 120px; object-fit: cover; border: 3px solid black; float: right; margin-left: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Forja de Heróis</h1>

        <button class="btn-expande" onclick="toggle('form-personagem')">✚ NOVO PERSONAGEM / EDITAR</button>
        <div id="form-personagem" class="conteudo">
            <input type="hidden" id="edit-id" value="">
            <label>Imagem</label>
            <input type="file" id="p-img-input" accept="image/*" onchange="uploadImagem()">
            <input type="hidden" id="p-img-base64">
            <div id="preview-container"></div>

            <label>Nome</label>
            <input type="text" id="p-nome">
            
            <div class="grid grid-cols-3 gap-2">
                <div><label>Classe</label><input type="text" id="p-classe"></div>
                <div><label>Nível</label><input type="number" id="p-nivel" value="1" oninput="calcPericias()"></div>
                <div><label>XP</label><input type="number" id="p-xp" value="0"></div>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <div><label>PV (Vida)</label><input type="number" id="p-pv" value="10"></div>
                <div><label>CA (Armadura)</label><input type="number" id="p-ca" value="10"></div>
                <div><label>Proficiência</label><input type="number" id="p-prof" value="2" oninput="calcPericias()"></div>
            </div>

            <label>Atributos</label>
            <div class="grid grid-cols-6 gap-2">
                <div><label>FOR</label><input type="number" id="v-for" value="10" oninput="calcPericias()"></div>
                <div><label>DES</label><input type="number" id="v-des" value="10" oninput="calcPericias()"></div>
                <div><label>CON</label><input type="number" id="v-con" value="10" oninput="calcPericias()"></div>
                <div><label>INT</label><input type="number" id="v-int" value="10" oninput="calcPericias()"></div>
                <div><label>SAB</label><input type="number" id="v-sab" value="10" oninput="calcPericias()"></div>
                <div><label>CAR</label><input type="number" id="v-car" value="10" oninput="calcPericias()"></div>
            </div>

            <label class="mt-4">Perícias (Proficiência Automática)</label>
            <div id="area-pericias" class="bg-black p-3 rounded mb-4 max-h-48 overflow-y-auto border border-gray-800"></div>

            <label>Inventário</label>
            <textarea id="p-inventario" rows="3"></textarea>

            <button onclick="salvarHeroi()" class="bg-yellow-600 text-black w-full p-3 font-bold rounded">💾 SALVAR PERSONAGEM</button>
        </div>

        <hr class="my-6 border-gray-800 opacity-30">

        <button class="btn-expande" onclick="toggle('lista-p')">📋 MEUS PERSONAGENS</button>
        <div id="lista-p" class="conteudo"></div>

        <button class="btn-expande" onclick="toggle('lista-m')">✨ GRIMÓRIO (MAGIAS)</button>
        <div id="lista-m" class="conteudo">
            <div class="bg-black/40 p-4 rounded border border-yellow-600/30 mb-6">
                <label>Criar Nova Magia</label>
                <input type="text" id="new-m-nome" placeholder="Nome da Magia">
                <input type="number" id="new-m-nivel" placeholder="Nível (0 = Truque)">
                <textarea id="new-m-desc" placeholder="Descrição da magia..." rows="2"></textarea>
                <label>Adicionar direto na ficha de:</label>
                <select id="select-m-heroi"></select>
                <button onclick="salvarMagiaGlobal()" class="bg-yellow-600 text-black w-full p-2 font-bold rounded mt-2">CRIAR E SALVAR</button>
            </div>
            <hr class="border-gray-800 mb-4">
            <div id="render-lista-m"></div>
        </div>

        <button class="btn-expande" onclick="toggle('lista-t')">📜 LISTA DE TALENTOS</button>
        <div id="lista-t" class="conteudo">
            <div class="bg-black/40 p-4 rounded border border-yellow-600/30 mb-6">
                <label>Criar Novo Talento</label>
                <input type="text" id="new-t-nome" placeholder="Nome do Talento">
                <textarea id="new-t-desc" placeholder="Descrição do talento..." rows="2"></textarea>
                <label>Adicionar direto na ficha de:</label>
                <select id="select-t-heroi"></select>
                <button onclick="salvarTalentoGlobal()" class="bg-yellow-600 text-black w-full p-2 font-bold rounded mt-2">CRIAR E SALVAR</button>
            </div>
            <hr class="border-gray-800 mb-4">
            <div id="render-lista-t"></div>
        </div>

        <button class="btn-expande" onclick="toggle('lista-h')">⚔️ HABILIDADES DE CLASSE</button>
        <div id="lista-h" class="conteudo">
            <div class="bg-black/40 p-4 rounded border border-yellow-600/30 mb-6">
                <label>Criar Nova Habilidade</label>
                <input type="text" id="new-h-nome" placeholder="Nome da Habilidade">
                <textarea id="new-h-desc" placeholder="Descrição da habilidade..." rows="2"></textarea>
                <label>Adicionar direto na ficha de:</label>
                <select id="select-h-heroi"></select>
                <button onclick="salvarHabGlobal()" class="bg-yellow-600 text-black w-full p-2 font-bold rounded mt-2">CRIAR E SALVAR</button>
            </div>
            <hr class="border-gray-800 mb-4">
            <div id="render-lista-h"></div>
        </div>
    </div>

    <div id="modal-seletor" style="display:none" class="fixed inset-0 bg-black/90 z-[2000] flex items-center justify-center p-4">
        <div class="bg-[#161618] border border-yellow-600 p-6 rounded-lg w-full max-w-sm">
            <h3 class="text-yellow-500 font-cinzel mb-4">Adicionar a qual personagem?</h3>
            <div id="lista-opcoes-pers" class="flex flex-col gap-2 mb-4"></div>
            <button onclick="document.getElementById('modal-seletor').style.display='none'" class="w-full p-2 bg-gray-800 text-white rounded">CANCELAR</button>
        </div>
    </div>

    <div id="modal-ficha">
        <div class="dnd-sheet">
            <div id="corpo-ficha"></div>
            <div class="flex gap-2 mt-4">
                <button id="btn-edit-ficha" class="flex-1 p-3 bg-blue-600 text-white font-bold rounded">EDITAR</button>
                <button onclick="document.getElementById('modal-ficha').style.display='none'" class="flex-1 p-3 bg-black text-white font-bold rounded">FECHAR</button>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('rpg_v20')) || { herois: [], magias: [], talentos: [], habs: [] };

        let itemTemporario = null;
        const periciasBase = [{n:"Acrobacia", a:"des"}, {n:"Adestrar Animais", a:"sab"}, {n:"Arcanismo", a:"int"}, {n:"Atletismo", a:"for"}, {n:"Atuação", a:"car"}, {n:"Enganação", a:"car"}, {n:"Furtividade", a:"des"}, {n:"História", a:"int"}, {n:"Intimidação", a:"car"}, {n:"Intuição", a:"sab"}, {n:"Investigação", a:"int"}, {n:"Medicina", a:"sab"}, {n:"Natureza", a:"int"}, {n:"Percepção", a:"sab"}, {n:"Persuasão", a:"car"}, {n:"Prestidigitação", a:"des"}, {n:"Religião", a:"int"}, {n:"Sobrevivência", a:"sab"}];

        function toggle(id) { const el = document.getElementById(id); el.style.display = el.style.display === 'block' ? 'none' : 'block'; }

        function uploadImagem() {
            const file = document.getElementById('p-img-input').files[0];
            const reader = new FileReader();
            reader.onloadend = () => {
                document.getElementById('p-img-base64').value = reader.result;
                document.getElementById('preview-container').innerHTML = `<img src="${reader.result}" class="img-preview">`;
            }
            if (file) reader.readAsDataURL(file);
        }

        function calcPericias() {
            const container = document.getElementById('area-pericias');
            const prof = parseInt(document.getElementById('p-prof').value) || 0;
            container.innerHTML = periciasBase.map((p, i) => {
                const mod = Math.floor((document.getElementById('v-'+p.a).value - 10) / 2);
                const isChecked = document.getElementById('ck-'+i)?.checked;
                return `<div class="pericia-linha"><label class="flex items-center gap-2 m-0 cursor-pointer"><input type="checkbox" id="ck-${i}" onchange="calcPericias()" ${isChecked?'checked':''}> ${p.n}</label><span class="font-bold text-yellow-600">${isChecked ? mod + prof : mod}</span></div>`;
            }).join('');
        }

        function salvarMagiaGlobal() {
            const nome = document.getElementById('new-m-nome').value;
            const nivel = parseInt(document.getElementById('new-m-nivel').value) || 0;
            const desc = document.getElementById('new-m-desc').value;
            const pIdx = document.getElementById('select-m-heroi').value;

            if(!nome) return alert("Dê um nome à magia!");
            const novaM = { nome, nivel, desc };
            db.magias.push(novaM);
            if(pIdx !== "") db.herois[pIdx].magias.push(novaM);
            
            atualizarTudo();
            document.getElementById('new-m-nome').value = "";
            document.getElementById('new-m-desc').value = "";
        }

        function salvarHabGlobal() {
            const nome = document.getElementById('new-h-nome').value;
            const desc = document.getElementById('new-h-desc').value;
            const pIdx = document.getElementById('select-h-heroi').value;

            if(!nome) return alert("Dê um nome à habilidade!");
            const novaH = { nome, desc };
            db.habs.push(novaH);
            if(pIdx !== "") db.herois[pIdx].habs.push(novaH);
            
            atualizarTudo();
            document.getElementById('new-h-nome').value = "";
            document.getElementById('new-h-desc').value = "";
        }

        function salvarTalentoGlobal() {
            const nome = document.getElementById('new-t-nome').value;
            const desc = document.getElementById('new-t-desc').value;
            const pIdx = document.getElementById('select-t-heroi').value;

            if(!nome) return alert("Dê um nome ao talento!");
            const novoT = { nome, desc };
            db.talentos.push(novoT);
            if(pIdx !== "") db.herois[pIdx].talentos.push(novoT);
            
            atualizarTudo();
            document.getElementById('new-t-nome').value = "";
            document.getElementById('new-t-desc').value = "";
        }

        function atualizarSelectsHerois() {
            const options = '<option value="">-- Não adicionar a ninguém --</option>' + 
                db.herois.map((p, i) => `<option value="${i}">${p.nome}</option>`).join('');
            document.getElementById('select-m-heroi').innerHTML = options;
            document.getElementById('select-h-heroi').innerHTML = options;
            document.getElementById('select-t-heroi').innerHTML = options;
        }

        function salvarHeroi() {
            const id = document.getElementById('edit-id').value;
            const checks = periciasBase.map((_, i) => document.getElementById('ck-'+i) ? document.getElementById('ck-'+i).checked : false);
            
            const heroi = {
                nome: document.getElementById('p-nome').value || "Herói Sem Nome",
                classe: document.getElementById('p-classe').value,
                nivel: document.getElementById('p-nivel').value,
                xp: document.getElementById('p-xp').value,
                pv: document.getElementById('p-pv').value,
                ca: document.getElementById('p-ca').value,
                prof: document.getElementById('p-prof').value,
                img: document.getElementById('p-img-base64').value,
                atts: { 
                    for: document.getElementById('v-for').value, 
                    des: document.getElementById('v-des').value, 
                    con: document.getElementById('v-con').value, 
                    int: document.getElementById('v-int').value, 
                    sab: document.getElementById('v-sab').value, 
                    car: document.getElementById('v-car').value 
                },
                periciasProf: checks,
                inventario: document.getElementById('p-inventario').value,
                magias: id !== "" ? db.herois[id].magias : [],
                talentos: id !== "" ? db.herois[id].talentos : [],
                habs: id !== "" ? db.herois[id].habs : []
            };

            if(id !== "") db.herois[id] = heroi; else db.herois.push(heroi);
            atualizarTudo();
            toggle('form-personagem');
            limparForm();
        }

        function abrirFicha(i) {
            const p = db.herois[i];
            const mod = (v) => Math.floor((v - 10) / 2);
            document.getElementById('corpo-ficha').innerHTML = `
                <img src="${p.img || ''}" class="sheet-img" onerror="this.style.display='none'">
                <h2 class="text-2xl font-bold font-cinzel">${p.nome}</h2>
                <p class="text-xs uppercase mb-1">${p.classe} — Nível ${p.nivel} (XP: ${p.xp})</p>
                <div class="flex gap-4 mb-4 text-sm font-bold">
                    <div class="bg-red-100 p-2 rounded">PV: ${p.pv}</div>
                    <div class="bg-blue-100 p-2 rounded">CA: ${p.ca}</div>
                </div>
                <div class="grid grid-cols-6 gap-1 mb-4 text-center">
                    ${Object.entries(p.atts).map(([k,v]) => `<div class="border border-black bg-gray-100 p-1"><div class="text-[9px] uppercase">${k}</div><b>${mod(v)>=0?'+':''}${mod(v)}</b></div>`).join('')}
                </div>
                <div class="grid grid-cols-2 gap-4 text-[10px] mb-4">
                    <div class="border p-2"><b>PERÍCIAS</b>
                        ${periciasBase.map((pb, idx) => {
                            const val = p.periciasProf[idx] ? mod(p.atts[pb.a]) + parseInt(p.prof) : mod(p.atts[pb.a]);
                            return `<div>${p.periciasProf[idx]?'●':'○'} ${pb.n}: <b>${val >= 0 ? '+' : ''}${val}</b></div>`;
                        }).join('')}
                    </div>
                    <div class="border p-2"><b>INVENTÁRIO</b><br>${p.inventario.replace(/\n/g, '<br>')}</div>
                </div>
                <div class="ficha-categoria-titulo">MAGIAS</div>${renderMagiasFicha(p.magias, i)}
                <div class="ficha-categoria-titulo">TALENTOS</div>${renderItensFicha(p.talentos, i, 'talentos')}
                <div class="ficha-categoria-titulo">HABILIDADES</div>${renderItensFicha(p.habs, i, 'habs')}
            `;
            document.getElementById('btn-edit-ficha').onclick = () => prepararEdicao(i);
            document.getElementById('modal-ficha').style.display = 'block';
        }

        function renderMagiasFicha(arr, pIdx) {
            if(!arr || arr.length === 0) return "<p class='text-[10px]'>Nenhum.</p>";
            const agrupadas = arr.reduce((acc, magia) => {
                const nv = magia.nivel !== undefined ? magia.nivel : "?";
                if (!acc[nv]) acc[nv] = [];
                acc[nv].push(magia);
                return acc;
            }, {});
            return Object.keys(agrupadas).sort().map(nivel => {
                const titulo = nivel == 0 ? "TRUQUES" : `NÍVEL ${nivel}`;
                const itens = agrupadas[nivel].map((it) => {
                    const originalIdx = db.herois[pIdx].magias.indexOf(it);
                    const idUnico = `desc-magia-${pIdx}-${nivel}-${Math.random().toString(36).substr(2, 5)}`;
                    return `<div class="ficha-item-linha"><span class="nome-clicavel" onclick="toggleDesc('${idUnico}')">${it.nome}</span><button onclick="removerItemFicha(${pIdx}, 'magias', ${originalIdx})" class="text-red-600 font-bold ml-2">✖</button></div><div id="${idUnico}" class="desc-expandida">${it.desc}</div>`;
                }).join('');
                return `<div class="mt-2 border-b border-gray-200 bg-gray-100 px-1 text-[9px] font-bold text-gray-500">${titulo}</div>${itens}`;
            }).join('');
        }

        function renderItensFicha(arr, pIdx, tipo) {
            if(!arr || arr.length === 0) return "<p class='text-[10px]'>Nenhum.</p>";
            return arr.map((it, idx) => `<div class="ficha-item-linha"><span class="nome-clicavel" onclick="toggleDesc('desc-${tipo}-${idx}')">${it.nome}</span><button onclick="removerItemFicha(${pIdx}, '${tipo}', ${idx})" class="text-red-600 font-bold ml-2">✖</button></div><div id="desc-${tipo}-${idx}" class="desc-expandida">${it.desc}</div>`).join('');
        }

        function toggleDesc(id) { const el = document.getElementById(id); if(el) el.style.display = el.style.display === 'block' ? 'none' : 'block'; }

        function abrirSeletor(itemIdx, tipo) {
            itemTemporario = { item: db[tipo][itemIdx], tipo: tipo };
            const lista = document.getElementById('lista-opcoes-pers');
            lista.innerHTML = db.herois.map((p, i) => `<button onclick="confirmarAdicao(${i})" class="bg-yellow-600 text-black font-bold p-2 rounded w-full mb-1">${p.nome}</button>`).join('');
            document.getElementById('modal-seletor').style.display = 'flex';
        }

        function confirmarAdicao(pIdx) {
            db.herois[pIdx][itemTemporario.tipo].push(itemTemporario.item);
            atualizarTudo();
            document.getElementById('modal-seletor').style.display = 'none';
            alert("Adicionado!");
        }

        function removerItemFicha(pIdx, tipo, itemIdx) {
            db.herois[pIdx][tipo].splice(itemIdx, 1);
            atualizarTudo();
            abrirFicha(pIdx);
        }

        function prepararEdicao(i) {
            const p = db.herois[i];
            document.getElementById('edit-id').value = i;
            document.getElementById('p-nome').value = p.nome;
            document.getElementById('p-classe').value = p.classe;
            document.getElementById('p-nivel').value = p.nivel;
            document.getElementById('p-xp').value = p.xp;
            document.getElementById('p-pv').value = p.pv;
            document.getElementById('p-ca').value = p.ca;
            document.getElementById('p-prof').value = p.prof;
            document.getElementById('p-img-base64').value = p.img;
            document.getElementById('preview-container').innerHTML = `<img src="${p.img}" class="img-preview">`;
            document.getElementById('p-inventario').value = p.inventario;
            Object.entries(p.atts).forEach(([k,v]) => document.getElementById('v-'+k).value = v);
            document.getElementById('modal-ficha').style.display = 'none';
            toggle('form-personagem');
            calcPericias();
            p.periciasProf.forEach((check, idx) => { if(document.getElementById('ck-'+idx)) document.getElementById('ck-'+idx).checked = check; });
            calcPericias();
        }

        function atualizarTudo() { 
            localStorage.setItem('rpg_v20', JSON.stringify(db)); 
            renderListasUI(); 
            atualizarSelectsHerois();
        }

        function renderListasUI() {
            // Render Magias
            const containerM = document.getElementById('render-lista-m');
            if(containerM) {
                const agrupadasM = db.magias.reduce((acc, m) => {
                    const nv = m.nivel !== undefined ? m.nivel : "?";
                    if (!acc[nv]) acc[nv] = [];
                    acc[nv].push(m);
                    return acc;
                }, {});
                containerM.innerHTML = Object.keys(agrupadasM).sort().map(nivel => {
                    const titulo = nivel == 0 ? "Truques" : `Nível ${nivel}`;
                    const itens = agrupadasM[nivel].map(item => {
                        const idxGlobal = db.magias.indexOf(item);
                        return `<div class="item-card"><span>${item.nome}</span><div class="flex gap-2"><button onclick="abrirSeletor(${idxGlobal}, 'magias')" class="text-yellow-500 font-bold">✚ ADD</button><button onclick="excluirItemBanco(${idxGlobal}, 'magias')" class="text-red-500">✖</button></div></div>`;
                    }).join('');
                    return `<div class="text-yellow-600 font-bold text-[10px] mb-1 mt-3 uppercase border-b border-yellow-900/30">${titulo}</div>${itens}`;
                }).join('');
            }

            const rNormal = (arr, t, id) => {
                const container = document.getElementById(id);
                if (!container) return;
                container.innerHTML = arr.map((item, i) => `<div class="item-card"><span>${item.nome}</span><div class="flex gap-2"><button onclick="abrirSeletor(${i}, '${t}')" class="text-yellow-500 font-bold">✚ ADD</button><button onclick="excluirItemBanco(${i}, '${t}')" class="text-red-500">✖</button></div></div>`).join('');
            };

            rNormal(db.talentos, 'talentos', 'render-lista-t');
            rNormal(db.habs, 'habs', 'render-lista-h');
            document.getElementById('lista-p').innerHTML = db.herois.map((p, i) => `<div class="item-card"><span onclick="abrirFicha(${i})" class="cursor-pointer font-bold text-yellow-500 flex-1">${p.nome} (Nv ${p.nivel})</span><button onclick="excluirHeroi(${i})" class="text-red-500">✖</button></div>`).join('');
        }

        function excluirItemBanco(i, tipo) { if(confirm("Excluir do banco?")) { db[tipo].splice(i, 1); atualizarTudo(); } }
        function excluirHeroi(i) { if(confirm("Excluir personagem?")) { db.herois.splice(i, 1); atualizarTudo(); } }
        function limparForm() { document.getElementById('edit-id').value = ""; document.getElementById('p-img-base64').value = ""; document.getElementById('preview-container').innerHTML = ""; document.getElementById('p-nome').value = ""; document.getElementById('p-inventario').value = ""; }

        calcPericias();
        renderListasUI();
        atualizarSelectsHerois();
    </script>
